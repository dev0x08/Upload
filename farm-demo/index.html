<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nông Trại Mây v0.3.4</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(150deg,#b8efff,#fbe8ef);color:#fff;overflow:hidden}button{font:inherit}.game{height:100dvh;min-height:640px;position:relative}.card{background:#203f37ee;border:1px solid #ffffff32;backdrop-filter:blur(10px);border-radius:18px;box-shadow:0 10px 24px #244b4033}.top{position:absolute;z-index:20;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.profile{display:flex;align-items:center;gap:9px;padding:7px 10px}.avatar{width:46px;height:46px;border-radius:14px;background:#ffe59a;display:grid;place-items:center;font-size:27px;border:2px solid white}.name{font-weight:900}.xp{width:120px;height:8px;background:#10261f;border-radius:99px;overflow:hidden}.xp i{display:block;height:100%;background:#ffd45c}.money{padding:11px 14px;font-size:20px;font-weight:900}.energy,.weather{position:absolute;z-index:20;top:78px;padding:8px 11px}.energy{left:14px;width:190px}.weather{right:14px;min-width:126px;text-align:center}.track{height:7px;background:#10261f;border-radius:99px;overflow:hidden;margin-top:5px}.track i{display:block;height:100%;background:#58bfff}.toolbar{position:absolute;z-index:30;top:124px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:#24453dbc;border-radius:19px}.tool{width:51px;height:48px;border:0;border-radius:14px;background:linear-gradient(#fff6cc,#f5c34e);box-shadow:0 5px #8a633c;color:#513a24;font-size:20px}.tool small{display:block;font-size:8px;font-weight:800}.island{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);width:114vw;height:64vh;border-radius:39% 39% 35% 42%/22% 25% 23% 27%;background:radial-gradient(circle,#b9ef72 0 42%,#8bd153 68%,#5ba844);box-shadow:0 22px 0 #4e8b42,0 38px 0 #317d83}.plots{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:84%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.plot{aspect-ratio:1.18;border:0;border-radius:16px;background:linear-gradient(145deg,#a46e44,#744526);box-shadow:inset 0 6px #ffffff10,0 6px #50321d50;position:relative;color:white}.plot.locked{background:linear-gradient(145deg,#95d65c,#67af41)}.crop{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);filter:drop-shadow(0 4px 2px #0003)}.stage-seed .crop{font-size:19px}.stage-sprout .crop{font-size:25px}.stage-young .crop{font-size:30px}.stage-mature .crop{font-size:35px}.ready .crop{font-size:38px;animation:pulse .9s ease-in-out infinite}.tag{position:absolute;top:5px;left:50%;transform:translateX(-50%);background:#203a34dd;border-radius:99px;font-size:8px;padding:3px 6px;white-space:nowrap}.stage{position:absolute;left:7px;bottom:14px;font-size:8px;background:#3b271db8;padding:2px 5px;border-radius:99px}.grow{position:absolute;left:10%;right:10%;bottom:6px;height:5px;background:#271f1aa9;border-radius:8px;overflow:hidden}.grow i{display:block;height:100%;background:#ffd35c}.wet:after{content:'💧';position:absolute;right:4px;top:4px}.fert:before{content:'✨';position:absolute;left:4px;top:4px}.problem{position:absolute;right:4px;bottom:18px;font-size:16px}.bottom{position:absolute;z-index:25;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.mission{padding:9px 12px}.mission strong{display:block;font-size:12px}.tray{padding:7px;display:flex;gap:6px;max-width:56vw;overflow:auto}.seed{width:45px;height:45px;border:2px solid transparent;border-radius:14px;background:#ffffff16;color:#fff;font-size:22px;position:relative}.seed.active{border-color:#ffd65b}.seed b{position:absolute;right:2px;bottom:2px;background:#172a25d8;border-radius:99px;font-size:8px;padding:2px 5px}.modal{position:fixed;z-index:60;inset:0;background:#102c3388;display:none;place-items:center;padding:14px}.modal.open{display:grid}.panel{width:min(720px,96vw);max-height:88vh;overflow:auto;background:#fff4d8;color:#503921;border-radius:24px;padding:16px}.head{display:flex;justify-content:space-between;align-items:center}.close,.primary{border:0;border-radius:10px;background:#69a742;color:white;padding:8px 10px;font-weight:900}.close{width:36px;height:36px;border-radius:50%;background:#674832}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fffaf0;border:1px solid #ead8b7;border-radius:13px;padding:10px;margin:7px 0}.help{background:#fffaf0;border-radius:12px;padding:10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{background:#fffaf0;border:1px solid #ead8b7;border-radius:14px;padding:10px;text-align:center}.toast{position:fixed;z-index:90;top:92px;left:50%;transform:translateX(-50%);background:#18372fee;padding:9px 14px;border-radius:99px;opacity:0;transition:.2s}.toast.show{opacity:1}@keyframes pulse{50%{transform:translateX(-50%) scale(1.12)}}
</style></head><body><main class="game"><header class="top"><div class="profile card"><div class="avatar">👨‍🌾</div><div><div class="name">Trang trại thử nghiệm</div><div style="font-size:11px">LV <b id="lv">1</b></div><div class="xp"><i id="xp"></i></div></div></div><div class="money card">🌿 <span id="coin">0</span></div></header><div class="energy card">⚡ Năng lượng <b id="energyTxt"></b><div class="track"><i id="energy"></i></div></div><div class="weather card" id="weather">☀️ Nắng</div><aside class="toolbar"><button class="tool" onclick="openModal('shop')">🏪<small>Shop</small></button><button class="tool" onclick="openModal('inventory')">🎒<small>Kho</small></button><button class="tool" onclick="openModal('orders')">📦<small>Đơn</small></button><button class="tool" onclick="openModal('quests')">📋<small>Nhiệm vụ</small></button><button class="tool" onclick="openModal('daily')">🎁<small>Ngày</small></button><button class="tool" onclick="openModal('test')">🔧<small>Test</small></button></aside><section class="island"><div class="plots" id="plots"></div></section><footer class="bottom"><div class="mission card"><small>ĐANG THEO DÕI</small><strong id="mission">Thu hoạch 3 cây (0/3)</strong></div><div class="tray card" id="tray"></div></footer></main><div id="toast" class="toast"></div><div class="modal" id="modal"><section class="panel"><div class="head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></section></div><script>
const CROPS={corn:{name:'Bắp',icon:'🌽',buy:6,sell:15,grow:40,xp:8,level:1},carrot:{name:'Cà rốt',icon:'🥕',buy:9,sell:22,grow:48,xp:11,level:1},wheat:{name:'Lúa mì',icon:'🌾',buy:12,sell:30,grow:58,xp:14,level:2},tomato:{name:'Cà chua',icon:'🍅',buy:16,sell:39,grow:70,xp:18,level:3},strawberry:{name:'Dâu tây',icon:'🍓',buy:24,sell:58,grow:85,xp:25,level:4},pumpkin:{name:'Bí ngô',icon:'🎃',buy:34,sell:82,grow:100,xp:34,level:5}};
const WEATHER={sunny:{name:'Nắng',icon:'☀️',speed:1.05},cloudy:{name:'Nhiều mây',icon:'☁️',speed:1},rain:{name:'Mưa',icon:'🌧️',speed:.92},hot:{name:'Nắng nóng',icon:'🌤️',speed:.82}};
const QUESTS=[{id:'harvest3',title:'Thu hoạch 3 cây',type:'harvest',target:3,reward:60},{id:'plant10',title:'Trồng 10 cây',type:'plant',target:10,reward:90},{id:'water8',title:'Tưới 8 lần',type:'water',target:8,reward:75},{id:'fert5',title:'Bón phân 5 lần',type:'fert',target:5,reward:90}];
const ORDER_TEMPLATES=[{name:'Quán ăn trong làng',need:{corn:3,carrot:2},reward:120},{name:'Chợ buổi sáng',need:{wheat:4,carrot:2},reward:165},{name:'Nhà hàng ven sông',need:{tomato:3,corn:3},reward:210}];
const DEFAULT={coin:220,lv:1,xp:0,energy:20,maxEnergy:20,lastEnergy:Date.now(),selected:'corn',weather:'sunny',inventory:{seeds:{corn:8,carrot:5,wheat:2,tomato:0,strawberry:0,pumpkin:0},produce:{corn:0,carrot:0,wheat:0,tomato:0,strawberry:0,pumpkin:0},fertilizer:3,pesticide:2},stats:{plant:0,harvest:0,water:0,fert:0},plots:[],orders:[],claimed:{},version:34};
function clone(x){return JSON.parse(JSON.stringify(x))}function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]}return a}
function blankPlot(unlocked){return{unlocked,crop:null,plantedAt:0,watered:false,fertilized:false,problem:null,problemChecked:false,dead:false}}
function loadState(){let old=null;try{old=JSON.parse(localStorage.getItem('farmCloudV034')||localStorage.getItem('farmCloudV033')||localStorage.getItem('farmCloudV031')||'null')}catch{}const s=clone(DEFAULT);if(old)merge(s,old);if(!s.inventory.pesticide&&s.inventory.pesticide!==0)s.inventory.pesticide=2;if(!s.plots.length)s.plots=Array.from({length:20},(_,i)=>blankPlot(i<12));s.plots=s.plots.slice(0,20).map((p,i)=>Object.assign(blankPlot(i<12),p));if(!s.orders.length)s.orders=ORDER_TEMPLATES.map((o,i)=>({id:i,...clone(o)}));s.version=34;return s}
let S=loadState();const $=q=>document.querySelector(q);function save(){localStorage.setItem('farmCloudV034',JSON.stringify(S))}function msg(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove('show'),1400)}
function regen(){const now=Date.now(),n=Math.floor((now-S.lastEnergy)/60000);if(n>0){S.energy=Math.min(S.maxEnergy,S.energy+n);S.lastEnergy+=n*60000;save()}}function spend(){regen();if(S.energy<1){msg('Hết năng lượng');return false}S.energy--;save();return true}
function progress(p){if(!p.crop)return 0;let speed=WEATHER[S.weather]?.speed||1;if(p.watered)speed*=1.18;if(p.fertilized)speed*=1.22;if(p.problem)speed*=.55;return Math.min(1,(Date.now()-p.plantedAt)/(CROPS[p.crop].grow*1000/speed))}
function stageInfo(q){if(q<.12)return{name:'Gieo hạt',icon:'🟤',cls:'stage-seed'};if(q<.36)return{name:'Mầm',icon:'🌱',cls:'stage-sprout'};if(q<.68)return{name:'Cây non',icon:'🌿',cls:'stage-young'};if(q<1)return{name:'Trưởng thành',icon:'🌳',cls:'stage-mature'};return{name:'Thu hoạch',icon:null,cls:'ready'}}
function maybeProblem(p,q){if(!p.crop||p.problemChecked||q<.38)return;if(Math.random()<.18){p.problem=Math.random()<.65?'pest':'disease';msg(p.problem==='pest'?'🐛 Cây bị sâu!':'🦠 Cây bị bệnh!')}p.problemChecked=true;save()}
function plotClick(i){const p=S.plots[i];if(!p.unlocked){const cost=60+(i-12)*25;if(S.coin<cost)return msg('Không đủ tiền');S.coin-=cost;p.unlocked=true;save();render();return}if(!p.crop){const c=CROPS[S.selected];if(!c||S.lv<c.level||!S.inventory.seeds[S.selected])return msg('Không có hạt phù hợp');if(!spend())return;S.inventory.seeds[S.selected]--;Object.assign(p,{crop:S.selected,plantedAt:Date.now(),watered:false,fertilized:false,problem:null,problemChecked:false,dead:false});S.stats.plant++;save();render();return}const q=progress(p);maybeProblem(p,q);if(q>=1&&!p.problem){if(!spend())return;const id=p.crop;S.inventory.produce[id]++;S.stats.harvest++;S.xp+=CROPS[id].xp;Object.assign(p,blankPlot(true));save();render();return msg('✅ Thu hoạch '+CROPS[id].name)}openCare(i)}
function openCare(i){const p=S.plots[i],q=progress(p),c=CROPS[p.crop],s=stageInfo(q);$('#modal').classList.add('open');$('#modalTitle').textContent=c.name+' • '+s.name;$('#modalBody').innerHTML=`<div class="help">Tiến độ ${Math.floor(q*100)}% ${p.problem?(p.problem==='pest'?'• 🐛 Sâu':'• 🦠 Bệnh'):''}</div><div class="row"><span>💧 Tưới nước</span><button class="primary" onclick="water(${i})" ${p.watered?'disabled':''}>${p.watered?'Đã tưới':'Tưới'}</button></div><div class="row"><span>✨ Bón phân (${S.inventory.fertilizer})</span><button class="primary" onclick="fert(${i})" ${p.fertilized||S.inventory.fertilizer<1?'disabled':''}>Bón</button></div><div class="row"><span>🧴 Thuốc (${S.inventory.pesticide})</span><button class="primary" onclick="spray(${i})" ${!p.problem||S.inventory.pesticide<1?'disabled':''}>Phun</button></div>`}
function water(i){const p=S.plots[i];if(p.watered||!spend())return;p.watered=true;S.stats.water++;save();openCare(i);render()}function fert(i){const p=S.plots[i];if(p.fertilized||S.inventory.fertilizer<1||!spend())return;S.inventory.fertilizer--;p.fertilized=true;S.stats.fert++;save();openCare(i);render()}function spray(i){const p=S.plots[i];if(!p.problem||S.inventory.pesticide<1||!spend())return;S.inventory.pesticide--;p.problem=null;save();openCare(i);render();msg('Đã xử lý sâu bệnh')}
function renderPlots(){for(const p of S.plots)if(p.crop)maybeProblem(p,progress(p));$('#plots').innerHTML=S.plots.map((p,i)=>{if(!p.unlocked)return `<button class="plot locked" onclick="plotClick(${i})"><span class="tag">🔒 ${60+Math.max(0,i-12)*25} 🌿</span></button>`;if(!p.crop)return `<button class="plot" onclick="plotClick(${i})"></button>`;const q=progress(p),c=CROPS[p.crop],s=stageInfo(q),ready=q>=1&&!p.problem,icon=ready?c.icon:s.icon;return `<button class="plot ${s.cls} ${ready?'ready':''} ${p.watered?'wet':''} ${p.fertilized?'fert':''}" onclick="plotClick(${i})"><span class="tag">${ready?'THU HOẠCH':Math.floor(q*100)+'%'}</span><span class="crop">${icon}</span><span class="stage">${s.name}</span>${p.problem?`<span class="problem">${p.problem==='pest'?'🐛':'🦠'}</span>`:''}<span class="grow"><i style="width:${q*100}%"></i></span></button>`}).join('')}
function render(){regen();$('#coin').textContent=S.coin;$('#lv').textContent=S.lv;$('#xp').style.width=Math.min(100,S.xp)+'%';$('#energyTxt').textContent=S.energy+'/'+S.maxEnergy;$('#energy').style.width=S.energy/S.maxEnergy*100+'%';const w=WEATHER[S.weather];$('#weather').textContent=w.icon+' '+w.name;const seeds=Object.entries(CROPS).filter(([id,c])=>S.lv>=c.level&&(S.inventory.seeds[id]||0)>0);if(!seeds.some(([id])=>id===S.selected)&&seeds.length)S.selected=seeds[0][0];$('#tray').innerHTML=seeds.map(([id,c])=>`<button class="seed ${S.selected===id?'active':''}" onclick="S.selected='${id}';save();render()">${c.icon}<b>${S.inventory.seeds[id]}</b></button>`).join('');const q=QUESTS.find(x=>!S.claimed[x.id])||QUESTS[0];$('#mission').textContent=q.title+' ('+Math.min(S.stats[q.type]||0,q.target)+'/'+q.target+')';renderPlots()}
function openModal(type){$('#modal').classList.add('open');const title=$('#modalTitle'),body=$('#modalBody');if(type==='shop'){title.textContent='Cửa hàng';body.innerHTML=`<div class="grid">${Object.entries(CROPS).map(([id,c])=>`<div class="item"><b>${c.icon} ${c.name}</b><p>Mua 5: ${c.buy*5} 🌿</p><button class="primary" onclick="buySeed('${id}')">Mua</button></div>`).join('')}<div class="item">✨ Phân bón<br><button class="primary" onclick="buyItem('fertilizer',3,45)">Mua 3 • 45</button></div><div class="item">🧴 Thuốc<br><button class="primary" onclick="buyItem('pesticide',3,60)">Mua 3 • 60</button></div></div>`}else if(type==='inventory'){title.textContent='Kho';const rows=Object.entries(CROPS).filter(([id])=>(S.inventory.seeds[id]||0)>0||(S.inventory.produce[id]||0)>0).map(([id,c])=>`<div class="row"><span>${c.icon} ${c.name}</span><span>${S.inventory.seeds[id]>0?'Hạt '+S.inventory.seeds[id]+' ':''}${S.inventory.produce[id]>0?'Nông sản '+S.inventory.produce[id]:''}</span></div>`).join('');body.innerHTML=rows+(S.inventory.fertilizer?`<div class="row">✨ Phân bón <b>${S.inventory.fertilizer}</b></div>`:'')+(S.inventory.pesticide?`<div class="row">🧴 Thuốc <b>${S.inventory.pesticide}</b></div>`:'')}else if(type==='orders'){title.textContent='Đơn hàng';body.innerHTML=S.orders.map(o=>`<div class="row"><span><b>${o.name}</b><br>${Object.entries(o.need).map(([k,v])=>CROPS[k].icon+' '+v).join(' • ')}</span><span>${o.reward} 🌿</span></div>`).join('')}else if(type==='quests'){title.textContent='Nhiệm vụ';body.innerHTML=QUESTS.map(q=>`<div class="row"><span>${q.title}</span><b>${Math.min(S.stats[q.type]||0,q.target)}/${q.target}</b></div>`).join('')}else if(type==='daily'){title.textContent='Quà ngày';body.innerHTML='<div class="help">🎁 Demo daily reward đang giữ nguyên để test gameplay nông trại.</div>'}else if(type==='test'){title.textContent='Công cụ test';body.innerHTML=`<div class="grid"><button class="primary" onclick="S.coin+=500;save();render()">+500 🌿</button><button class="primary" onclick="S.energy=S.maxEnergy;save();render()">Đầy ⚡</button><button class="primary" onclick="advanceStage()">+1 giai đoạn cây</button><button class="primary" onclick="nextWeather()">Đổi thời tiết</button><button class="primary" onclick="forceProblem()">Tạo sâu/bệnh</button><button class="primary" onclick="addSeeds()">+5 hạt</button></div>`}}
function closeModal(){$('#modal').classList.remove('open')}function buySeed(id){const c=CROPS[id],price=c.buy*5;if(S.coin<price)return msg('Không đủ tiền');S.coin-=price;S.inventory.seeds[id]+=5;save();openModal('shop');render()}function buyItem(k,n,cost){if(S.coin<cost)return msg('Không đủ tiền');S.coin-=cost;S.inventory[k]=(S.inventory[k]||0)+n;save();openModal('shop');render()}function advanceStage(){for(const p of S.plots)if(p.crop)p.plantedAt-=CROPS[p.crop].grow*1000*.25;save();render()}function nextWeather(){const a=Object.keys(WEATHER),i=a.indexOf(S.weather);S.weather=a[(i+1)%a.length];save();render()}function forceProblem(){const p=S.plots.find(x=>x.crop);if(!p)return msg('Hãy trồng cây trước');p.problem=Math.random()<.5?'pest':'disease';p.problemChecked=true;save();render()}function addSeeds(){for(const k in S.inventory.seeds)S.inventory.seeds[k]+=5;save();render()}$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();setInterval(()=>{renderPlots();regen();$('#energyTxt').textContent=S.energy+'/'+S.maxEnergy;$('#energy').style.width=S.energy/S.maxEnergy*100+'%'},1000);
</script></body></html>
