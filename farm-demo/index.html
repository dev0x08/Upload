<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nông Trại Mây v0.8.4</title><style>html,body{margin:0;height:100%;font-family:system-ui;background:#c9eef6}.load{height:100%;display:grid;place-items:center;color:#24483f}.box{text-align:center}.spin{font-size:42px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{border:0;border-radius:12px;padding:10px 16px;background:#69a742;color:#fff;font-weight:800}</style></head><body><div class="load"><div class="box"><div class="spin">🌱</div><b>Đang vào nông trại...</b><p id="e"></p></div></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/dev0x08/Upload/main/farm-demo/';const names=['v082-part1.txt','v082-part2.txt','v082-part3.txt','v082-part4.txt'];const a=await Promise.all(names.map(x=>fetch(base+x+'?v=084',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()})));const p1=a[0],p2=a[1],p3=a[2],p4=a[3];const k23=p3.slice(0,120),k34=p4.slice(0,120);const i23=p2.indexOf(k23),i34=p3.indexOf(k34);if(i23<0||i34<0)throw Error('Không ghép được bundle: '+i23+'/'+i34);const html=p1+p2.slice(0,i23)+p3.slice(0,i34)+p4;if(!html.includes('render();setInterval(render,1000)'))throw Error('Bundle thiếu đoạn khởi tạo');document.open();document.write(html);document.close()}catch(err){document.getElementById('e').innerHTML='Lỗi tải game: '+String(err.message||err)+'<br><button onclick="location.reload()">Thử lại</button>';console.error(err)}})()</script></body></html>
