<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Nông Trại Mây v0.2</title>
<style>
:root{--ink:#20352d;--cream:#fff4d8;--green:#72b948;--green2:#4a9136;--soil:#8b5a35;--gold:#ffd65b;--panel:#203f37ee;--danger:#d85d52}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(150deg,#b8efff,#fbe8ef);color:#fff;overflow:hidden}button{font:inherit}.game{height:100dvh;min-height:640px;position:relative;overflow:hidden}.topbar{position:absolute;z-index:20;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.leftHud,.rightHud{display:flex;gap:8px;align-items:center}.card{background:var(--panel);border:1px solid #ffffff32;backdrop-filter:blur(12px);box-shadow:0 12px 28px #26473d33;border-radius:18px}.profile{display:flex;gap:9px;align-items:center;padding:7px 11px 7px 7px}.avatar{width:50px;height:50px;border-radius:14px;background:#ffe59a;display:grid;place-items:center;font-size:29px;border:2px solid #fff}.name{font-weight:800}.muted{font-size:10px;opacity:.75}.lvlrow{display:flex;align-items:center;gap:7px;margin-top:3px}.progress{width:120px;height:8px;background:#10261f;border-radius:99px;overflow:hidden}.progress i{height:100%;display:block;background:linear-gradient(90deg,#ffe26c,#ffb944);width:0}.stat{padding:10px 12px;min-width:92px;text-align:center;font-weight:900}.energyBar{position:absolute;z-index:19;top:86px;left:18px;width:180px;padding:8px 10px}.energyTrack{height:7px;background:#10261f;border-radius:99px;overflow:hidden;margin-top:5px}.energyTrack i{display:block;height:100%;background:linear-gradient(90deg,#6ed7ff,#55a6ff)}.island{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:min(1040px,92vw);height:min(690px,70vh);border-radius:40% 38% 35% 42%/22% 25% 23% 27%;background:radial-gradient(circle at 48% 42%,#b9ef72 0 38%,#8bd153 65%,#5ba844 100%);box-shadow:0 22px 0 #4e8b42,0 38px 0 #317d83,0 52px 35px #254d5855}.plots{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:78%;display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.plot{aspect-ratio:1.18;border:0;border-radius:16px;background:linear-gradient(145deg,#a46e44,#744526);box-shadow:inset 0 6px #ffffff10,0 6px #50321d50;position:relative;cursor:pointer;transition:.12s transform}.plot:active{transform:scale(.96)}.plot.locked{background:linear-gradient(145deg,#95d65c,#67af41);color:#fff}.locktxt{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:900;text-shadow:0 1px 2px #0008}.crop{position:absolute;left:50%;bottom:19%;transform:translateX(-50%);font-size:34px;filter:drop-shadow(0 5px 2px #0003)}.stage1 .crop{font-size:24px}.stage2 .crop{font-size:29px}.ready .crop{animation:pulse .9s ease-in-out infinite}.tag{position:absolute;top:5px;left:50%;transform:translateX(-50%);background:#1f352fc9;padding:3px 6px;border-radius:99px;font-size:8px;white-space:nowrap}.grow{position:absolute;left:10%;right:10%;bottom:6px;height:5px;border-radius:8px;background:#271f1aa9;overflow:hidden}.grow i{display:block;height:100%;background:#ffd35c}.wet:before{content:'💧';position:absolute;right:4px;top:4px;font-size:13px}.fert:after{content:'✨';position:absolute;left:4px;top:4px;font-size:12px}.toolbar{position:absolute;z-index:25;right:14px;top:116px;display:grid;gap:9px}.tool{width:58px;height:58px;border:0;border-radius:17px;background:linear-gradient(#fff6cc,#f5c34e);box-shadow:0 6px #8a633c;color:#513a24;font-size:24px;cursor:pointer}.tool small{display:block;font-size:8px;font-weight:800}.bottom{position:absolute;z-index:22;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:flex-end;justify-content:space-between}.mission{padding:10px 13px;min-width:245px}.mission strong{display:block;font-size:12px}.mission .muted{margin-bottom:2px}.tray{padding:7px;display:flex;gap:6px;max-width:62vw;overflow:auto}.seed{width:52px;height:52px;flex:0 0 auto;border:2px solid transparent;border-radius:14px;background:#ffffff16;color:#fff;font-size:24px;position:relative}.seed.active{border-color:var(--gold);background:#ffd85c20}.seed b{position:absolute;right:3px;bottom:2px;background:#172a25d8;border-radius:99px;font-size:8px;padding:2px 5px}.modal{position:fixed;z-index:50;inset:0;background:#102c3388;display:none;place-items:center;padding:14px}.modal.open{display:grid}.panel{width:min(720px,96vw);max-height:86vh;overflow:auto;background:var(--cream);color:#503921;border-radius:24px;padding:18px;box-shadow:0 28px 70px #15363b66}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--cream);padding:6px 0 10px;z-index:3}.panel h2{margin:2px 0}.close{border:0;width:36px;height:36px;border-radius:50%;background:#674832;color:white}.tabs{display:flex;gap:7px;margin-bottom:12px;overflow:auto}.tab{border:0;border-radius:10px;background:#eadab9;color:#5e4326;padding:8px 11px;font-weight:800}.tab.active{background:#6fa848;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{background:#fffaf0;border:1px solid #ead8b7;border-radius:16px;padding:12px;text-align:center}.item .icon{font-size:34px}.item h4{margin:4px 0}.item p{margin:3px 0;font-size:11px;color:#785f43}.item button,.primary{border:0;border-radius:10px;background:#69a742;color:#fff;padding:8px 10px;font-weight:900;cursor:pointer}.item button.secondary{background:#c58b42}.danger{background:var(--danger)!important}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#eee0c4;font-size:10px;font-weight:800}.toast{position:fixed;z-index:90;top:95px;left:50%;transform:translateX(-50%);background:#18372fee;border:1px solid #ffffff30;padding:9px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1}.daily{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:10px 5px;border-radius:12px;background:#fffaf0;border:1px solid #e6d6b8;text-align:center;font-size:11px}.day.claimed{opacity:.5}.quest{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-radius:13px;background:#fffaf0;border:1px solid #ead8b7;margin:7px 0}.quest button[disabled]{opacity:.45}.invrow{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #ead8b7}.tiny{font-size:10px;color:#795f40}.help{font-size:12px;line-height:1.45;background:#fffaf0;padding:10px;border-radius:12px}.floating{position:absolute;pointer-events:none;z-index:80;font-weight:900;text-shadow:0 2px 2px #0005;animation:fly 1s ease-out forwards}@keyframes fly{to{transform:translateY(-50px);opacity:0}}@keyframes pulse{50%{transform:translateX(-50%) scale(1.12);filter:drop-shadow(0 0 10px #fff187)}}
@media(max-width:850px){.plots{grid-template-columns:repeat(5,1fr);width:82%;gap:8px}.island{width:114vw;height:67vh}.plot:nth-child(n+26){display:none}.grid{grid-template-columns:repeat(2,1fr)}.stat{min-width:76px;padding:8px}.profile .progress{width:85px}.bottom{left:8px;right:8px}.mission{min-width:180px;font-size:10px}.tray{max-width:58vw}.tool{width:50px;height:50px}.toolbar{right:8px}.energyBar{left:10px}.daily{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.topbar{left:8px;right:8px}.rightHud .stat:nth-child(2){display:none}.plots{grid-template-columns:repeat(4,1fr);width:84%;gap:7px}.plot:nth-child(n+21){display:none}.crop{font-size:28px}.seed{width:46px;height:46px}.mission{max-width:42vw;padding:8px}.grid{grid-template-columns:1fr}.panel{padding:14px}.avatar{width:44px;height:44px}.name{font-size:13px}.energyBar{top:78px;width:160px}.toolbar{top:106px}.tray{max-width:55vw}}
</style>
</head>
<body>
<main class="game">
  <header class="topbar">
    <div class="leftHud">
      <div class="profile card"><div class="avatar">👨‍🌾</div><div><div class="name">Trang trại thử nghiệm</div><div class="lvlrow"><span class="muted">LV <b id="lv">1</b></span><div class="progress"><i id="xpBar"></i></div></div></div></div>
    </div>
    <div class="rightHud"><div class="stat card">🌿 <span id="coin">0</span></div><div class="stat card">💎 <span id="gem">0</span></div></div>
  </header>
  <div class="energyBar card"><div class="muted">⚡ Năng lượng <b id="energyText"></b></div><div class="energyTrack"><i id="energyBar"></i></div></div>
  <aside class="toolbar">
    <button class="tool" onclick="openModal('shop')">🏪<small>Shop</small></button>
    <button class="tool" onclick="openModal('inventory')">🎒<small>Kho</small></button>
    <button class="tool" onclick="openModal('quests')">📋<small>Nhiệm vụ</small></button>
    <button class="tool" onclick="openModal('daily')">🎁<small>Hằng ngày</small></button>
    <button class="tool" onclick="openModal('settings')">⚙️<small>Cài đặt</small></button>
  </aside>
  <section class="island"><div class="plots" id="plots"></div></section>
  <footer class="bottom"><div class="mission card"><div class="muted">NHIỆM VỤ ĐANG THEO DÕI</div><strong id="missionTrack"></strong></div><div class="tray card" id="seedTray"></div></footer>
</main>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><section class="panel"><div class="panelHead"><div><div class="tiny">NÔNG TRẠI MÂY • V0.2</div><h2 id="modalTitle">Bảng điều khiển</h2></div><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></section></div>
<script>
const CROPS={corn:{name:'Bắp',icon:'🌽',buy:6,sell:15,grow:18,xp:8,level:1},carrot:{name:'Cà rốt',icon:'🥕',buy:9,sell:22,grow:25,xp:11,level:1},wheat:{name:'Lúa mì',icon:'🌾',buy:12,sell:30,grow:34,xp:14,level:2},tomato:{name:'Cà chua',icon:'🍅',buy:16,sell:39,grow:45,xp:18,level:3},strawberry:{name:'Dâu tây',icon:'🍓',buy:24,sell:58,grow:60,xp:25,level:4},pumpkin:{name:'Bí ngô',icon:'🎃',buy:34,sell:82,grow:80,xp:34,level:5}};
const QUESTS=[{id:'harvest3',title:'Thu hoạch 3 cây',type:'harvest',target:3,reward:60,xp:20},{id:'plant10',title:'Trồng 10 cây',type:'plant',target:10,reward:90,xp:30},{id:'sell5',title:'Bán 5 nông sản',type:'sell',target:5,reward:110,xp:35},{id:'unlock2',title:'Mở khóa thêm 2 ô đất',type:'unlock',target:2,reward:150,xp:45}];
const DAILY_REWARDS=[40,55,70,90,120,160,250];
const DEFAULT={coin:180,gem:5,lv:1,xp:0,energy:20,maxEnergy:20,lastEnergy:Date.now(),selected:'corn',inventory:{seeds:{corn:8,carrot:5,wheat:2,tomato:0,strawberry:0,pumpkin:0},produce:{corn:0,carrot:0,wheat:0,tomato:0,strawberry:0,pumpkin:0},fertilizer:3},stats:{plant:0,harvest:0,sell:0,unlock:0},claimedQuests:{},plots:[],daily:{day:1,lastClaim:null},version:2};
let S=load();
function load(){let v=null;try{v=JSON.parse(localStorage.getItem('farmCloudV02')||'null')}catch{};const s=structuredClone(DEFAULT);if(v)deepMerge(s,v);if(!s.plots.length)s.plots=Array.from({length:30},(_,i)=>({unlocked:i<12,crop:null,plantedAt:0,watered:false,fertilized:false}));return s}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))deepMerge(a[k],b[k]);else a[k]=b[k]}return a}
const $=q=>document.querySelector(q);function save(){localStorage.setItem('farmCloudV02',JSON.stringify(S))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1500)}
function regenEnergy(){const now=Date.now(),step=60000,add=Math.floor((now-S.lastEnergy)/step);if(add>0){S.energy=Math.min(S.maxEnergy,S.energy+add);S.lastEnergy+=add*step;if(S.energy===S.maxEnergy)S.lastEnergy=now;save()}}
function useEnergy(n=1){regenEnergy();if(S.energy<n){toast('⚡ Hết năng lượng, chờ hồi lại');return false}S.energy-=n;save();return true}
function addXp(n){S.xp+=n;while(S.xp>=100){S.xp-=100;S.lv++;S.maxEnergy++;S.energy=S.maxEnergy;toast('🎉 Lên cấp '+S.lv+'! Năng lượng đã đầy')}save()}
function cropProgress(p){if(!p.crop)return 0;const c=CROPS[p.crop],boost=(p.watered?0.78:1)*(p.fertilized?0.65:1),dur=c.grow*1000*boost;return Math.min(1,(Date.now()-p.plantedAt)/dur)}
function stageClass(q){return q<.34?'stage1':q<.72?'stage2':'stage3'}
function plotClick(i,ev){const p=S.plots[i];if(!p.unlocked)return unlockPlot(i);if(p.crop){const q=cropProgress(p);if(q>=1)return harvest(i,ev);if(!p.watered){if(!useEnergy(1))return;p.watered=true;save();toast('💧 Đã tưới nước');return render()}if(!p.fertilized&&S.inventory.fertilizer>0){S.inventory.fertilizer--;p.fertilized=true;save();toast('✨ Đã bón phân, cây lớn nhanh hơn');return render()}toast('🌱 Cây đang phát triển');return}const c=CROPS[S.selected];if(S.lv<c.level)return toast('🔒 Cần LV '+c.level);if((S.inventory.seeds[S.selected]||0)<=0)return toast('Hết hạt giống '+c.name);if(!useEnergy(1))return;S.inventory.seeds[S.selected]--;p.crop=S.selected;p.plantedAt=Date.now();p.watered=false;p.fertilized=false;S.stats.plant++;save();toast('🌱 Đã trồng '+c.name);render()}
function harvest(i,ev){const p=S.plots[i],id=p.crop,c=CROPS[id];if(!useEnergy(1))return;S.inventory.produce[id]=(S.inventory.produce[id]||0)+1;S.stats.harvest++;addXp(c.xp);p.crop=null;p.plantedAt=0;p.watered=false;p.fertilized=false;save();floatText(ev,'+'+c.xp+' XP');toast('✅ Thu hoạch '+c.name);render()}
function floatText(ev,t){if(!ev)return;const d=document.createElement('div');d.className='floating';d.textContent=t;d.style.left=(ev.clientX||innerWidth/2)+'px';d.style.top=(ev.clientY||innerHeight/2)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function unlockCost(i){return 80+(i-11)*35}
function unlockPlot(i){const p=S.plots[i],cost=unlockCost(i),need=Math.max(1,Math.ceil((i-10)/4));if(S.lv<need)return toast('🔒 Cần LV '+need);if(S.coin<cost)return toast('Thiếu '+(cost-S.coin)+' 🌿');S.coin-=cost;p.unlocked=true;S.stats.unlock++;save();toast('🧱 Đã mở ô đất #'+(i+1));render()}
function sellProduce(id,n=1){const have=S.inventory.produce[id]||0;if(have<n)return toast('Không đủ nông sản');S.inventory.produce[id]-=n;S.coin+=CROPS[id].sell*n;S.stats.sell+=n;save();render();renderModal('inventory');toast('💰 Đã bán '+n+' '+CROPS[id].name)}
function buySeeds(id,n=3){const c=CROPS[id];if(S.lv<c.level)return toast('Cần LV '+c.level);const price=c.buy*n;if(S.coin<price)return toast('Không đủ tiền');S.coin-=price;S.inventory.seeds[id]=(S.inventory.seeds[id]||0)+n;save();render();renderModal('shop');toast('🛒 Đã mua '+n+' hạt '+c.name)}
function buyFertilizer(){if(S.coin<45)return toast('Không đủ tiền');S.coin-=45;S.inventory.fertilizer++;save();render();renderModal('shop');toast('✨ +1 phân bón')}
function questProgress(q){return Math.min(q.target,S.stats[q.type]||0)}
function claimQuest(id){const q=QUESTS.find(x=>x.id===id);if(!q||S.claimedQuests[id])return;if(questProgress(q)<q.target)return toast('Chưa hoàn thành');S.claimedQuests[id]=true;S.coin+=q.reward;addXp(q.xp);save();render();renderModal('quests');toast('🎁 Nhận thưởng nhiệm vụ')}
function canClaimDaily(){if(!S.daily.lastClaim)return true;const a=new Date(S.daily.lastClaim),b=new Date();return a.toDateString()!==b.toDateString()}
function claimDaily(){if(!canClaimDaily())return toast('Hôm nay đã nhận rồi');const idx=(S.daily.day-1)%7,reward=DAILY_REWARDS[idx];S.coin+=reward;S.daily.lastClaim=Date.now();S.daily.day=S.daily.day%7+1;save();render();renderModal('daily');toast('🎁 Nhận '+reward+' 🌿')}
function resetGame(){if(confirm('Xóa toàn bộ dữ liệu localStorage của demo?')){localStorage.removeItem('farmCloudV02');location.reload()}}
function render(){regenEnergy();$('#lv').textContent=S.lv;$('#coin').textContent=S.coin;$('#gem').textContent=S.gem;$('#xpBar').style.width=S.xp+'%';$('#energyText').textContent=S.energy+'/'+S.maxEnergy;$('#energyBar').style.width=(S.energy/S.maxEnergy*100)+'%';renderPlots();renderSeeds();const active=QUESTS.find(q=>!S.claimedQuests[q.id])||QUESTS[0];$('#missionTrack').textContent=active.title+' ('+questProgress(active)+'/'+active.target+')'}
function renderPlots(){const root=$('#plots');root.innerHTML=S.plots.map((p,i)=>{if(!p.unlocked){const cost=unlockCost(i),need=Math.max(1,Math.ceil((i-10)/4));return `<button class="plot locked" onclick="plotClick(${i},event)"><span class="locktxt">🔒<br>LV ${need}<br>${cost} 🌿</span></button>`}if(!p.crop)return `<button class="plot" onclick="plotClick(${i},event)"></button>`;const c=CROPS[p.crop],q=cropProgress(p),ready=q>=1,icon=q<.34?'🌱':q<.72?'🌿':c.icon;let boost=(p.watered?'💧':'')+(p.fertilized?'✨':'');return `<button class="plot ${stageClass(q)} ${ready?'ready':''} ${p.watered?'wet':''} ${p.fertilized?'fert':''}" onclick="plotClick(${i},event)"><span class="tag">${ready?'THU HOẠCH':Math.ceil((1-q)*c.grow)+'s'} ${boost}</span><span class="crop">${icon}</span><span class="grow"><i style="width:${q*100}%"></i></span></button>`}).join('')}
function renderSeeds(){const root=$('#seedTray');root.innerHTML=Object.entries(CROPS).map(([id,c])=>`<button class="seed ${S.selected===id?'active':''}" onclick="selectSeed('${id}')" title="${c.name}">${c.icon}<b>${S.inventory.seeds[id]||0}</b></button>`).join('')}
function selectSeed(id){if(S.lv<CROPS[id].level)return toast('🔒 Cần LV '+CROPS[id].level);S.selected=id;save();render()}
function openModal(type){$('#modal').classList.add('open');$('#modal').dataset.type=type;renderModal(type)}function closeModal(){$('#modal').classList.remove('open')}
function renderModal(type=$('#modal').dataset.type){const body=$('#modalBody'),title=$('#modalTitle');if(type==='shop'){title.textContent='Cửa hàng';body.innerHTML=`<div class="tabs"><button class="tab active">Hạt giống & vật tư</button></div><div class="grid">${Object.entries(CROPS).map(([id,c])=>`<div class="item"><div class="icon">${c.icon}</div><h4>${c.name}</h4><p>LV ${c.level} • ${c.grow}s • bán ${c.sell} 🌿</p><button onclick="buySeeds('${id}',3)">Mua 3 hạt • ${c.buy*3} 🌿</button></div>`).join('')}<div class="item"><div class="icon">✨</div><h4>Phân bón</h4><p>Rút ngắn thời gian sinh trưởng</p><button onclick="buyFertilizer()">Mua 1 • 45 🌿</button></div></div>`}else if(type==='inventory'){title.textContent='Kho đồ';body.innerHTML=`<div class="help">Kho tạm thời chưa giới hạn sức chứa. Sau khi gameplay ổn sẽ thêm nâng cấp kho.</div><h3>🌱 Hạt giống</h3>${Object.entries(CROPS).map(([id,c])=>`<div class="invrow"><span>${c.icon} ${c.name}</span><b>x${S.inventory.seeds[id]||0}</b></div>`).join('')}<h3>📦 Nông sản</h3>${Object.entries(CROPS).map(([id,c])=>`<div class="invrow"><span>${c.icon} ${c.name} <span class="tiny">(${c.sell} 🌿/cái)</span></span><span><b>x${S.inventory.produce[id]||0}</b> <button class="primary" onclick="sellProduce('${id}',1)">Bán 1</button></span></div>`).join('')}<div class="invrow"><span>✨ Phân bón</span><b>x${S.inventory.fertilizer}</b></div>`}else if(type==='quests'){title.textContent='Nhiệm vụ';body.innerHTML=QUESTS.map(q=>{const prog=questProgress(q),done=prog>=q.target,claimed=!!S.claimedQuests[q.id];return `<div class="quest"><div><b>${claimed?'✅ ':''}${q.title}</b><div class="tiny">${prog}/${q.target} • thưởng ${q.reward} 🌿 + ${q.xp} XP</div></div><button class="primary" ${(!done||claimed)?'disabled':''} onclick="claimQuest('${q.id}')">${claimed?'Đã nhận':'Nhận'}</button></div>`}).join('')}else if(type==='daily'){title.textContent='Quà đăng nhập';const today=(S.daily.day-1)%7;body.innerHTML=`<div class="daily">${DAILY_REWARDS.map((r,i)=>`<div class="day ${i<today?'claimed':''}"><b>Ngày ${i+1}</b><div style="font-size:22px">🎁</div><strong>${r} 🌿</strong></div>`).join('')}</div><p><button class="primary" onclick="claimDaily()" ${canClaimDaily()?'':'disabled'}>${canClaimDaily()?'Nhận quà hôm nay':'Đã nhận hôm nay'}</button></p>`}else{title.textContent='Cài đặt & trạng thái';body.innerHTML=`<div class="help"><b>Save:</b> localStorage (farmCloudV02)<br><b>Hồi năng lượng:</b> +1 mỗi 60 giây<br><b>Tiến trình:</b> cây tiếp tục lớn khi đóng trình duyệt vì lưu timestamp.<br><br>Firebase chưa dùng ở bản này theo đúng kế hoạch test gameplay trước.</div><p><button class="primary" onclick="S.energy=S.maxEnergy;save();render();toast('⚡ Đã nạp đầy năng lượng test')">Nạp đầy năng lượng (test)</button></p><p><button class="primary" onclick="S.coin+=500;save();render();toast('+500 🌿 test')">+500 tiền (test)</button></p><p><button class="primary danger" onclick="resetGame()">Xóa save và chơi lại</button></p>`}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();setInterval(()=>{render();if($('#modal').classList.contains('open'))renderModal()},1000);
</script>
</body></html>
