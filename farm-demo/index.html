:62px;padding:8px 6px}.name{font-size:13px}.xp{width:70px}.etrack{width:52px}}</style></head><body><main class="game"><header class="top"><div class="profile card"><div class="avatar">👩‍🌾</div><div><div class="name">Trang trại thử nghiệm</div><div class="stats"><span>LV <b id="lv">1</b></span><div class="xp"><i id="xp"></i></div><span class="energy">⚡<b id="energyTxt"></b><span class="etrack"><i id="energy"></i></span></span></div></div></div><div class="money card">🌿 <span id="coin">0</span></div></header><div class="tw"><button class="weather card" id="weather" onclick="weatherDetail()">☀️ → ☁️ → 🌧️</button><div class="clock card" id="clock">00:00</div></div><aside class="toolbar" id="toolbar"><button class="navToggle" onclick="toggleNav()" id="navToggle">☰</button><div class="navitems"><button class="tool" onclick="openModal('shop')">🏪<small>Shop</small></button><button class="tool" onclick="openModal('inventory')">🎒<small>Kho</small></button><button class="tool" onclick="openModal('orders')">📦<small>Đơn</small></button><button class="tool" onclick="openModal('quests')">📋<small>N.vụ</small></button><button class="tool" onclick="openModal('daily')">🎁<small>Ngày</small></button><button class="tool" onclick="openModal('test')">🔧<small>Test</small></button></div></aside><section class="island"><div class="plots" id="plots"></div></section><footer class="bottom"><div class="mission card"><small>ĐANG THEO DÕI</small><strong id="mission"></strong></div><div class="tray card" id="tray"></div></footer></main><div id="toast" class="toast"></div><div class="modal" id="modal"><section class="panel"><div class="head"><h2 id="mt"></h2><button class="close" onclick="closeModal()">×</button></div><div id="mb"></div></section></div><script>const C={corn:['Bắp','🌽',6,15,55,8,1],carrot:['Cà rốt','🥕',9,22,65,11,1],wheat:['Lúa mì','🌾',12,30,78,14,2],tomato:['Cà chua','🍅',16,39,92,18,3],strawberry:['Dâu tây','🍓',24,58,110,25,4],pumpkin:['Bí ngô','🎃',34,82,135,34,5]},W={sunny:['Nắng','☀️',1.08,1],cloudy:['Nhiều mây','☁️',1,.9],rain:['Mưa','🌧️',.94,1.15],hot:['Nắng nóng','🌤️',.84,1.35]},Q=[['Thu hoạch 3 cây','harvest',3,60],['Trồng 10 cây','plant',10,90],['Tưới 8 lần','water',8,75],['Bón phân 5 lần','fert',5,90],['Xử lý sâu bệnh 3 lần','spray',3,120]],O=[['Quán ăn trong làng',{corn:3,carrot:2},120],['Chợ buổi sáng',{wheat:4,carrot:2},165],['Nhà hàng ven sông',{tomato:3,corn:3},210],['Lễ hội làng',{strawberry:2,pumpkin:1},290]],D=[40,55,70,90,120,160,250],K='farmCloudV050',WT=90000;const empty=u=>({unlocked:u,crop:null,plantedAt:0,wateredStages:[],fertilized:false,problem:null,checkedStages:[]});function randomWeather(exclude){let a=Object.keys(W).filter(x=>x!==exclude);return a[Math.floor(Math.random()*a.length)]}let def={coin:220,lv:1,xp:0,energy:20,maxEnergy:20,lastEnergy:Date.now(),selected:'corn',weather:'sunny',forecast:['cloudy','rain'],weatherChangedAt:Date.now(),inventory:{seeds:{corn:8,carrot:5,wheat:2,tomato:0,strawberry:0,pumpkin:0},produce:{corn:0,carrot:0,wheat:0,tomato:0,strawberry:0,pumpkin:0},fertilizer:3,pesticide:2},stats:{plant:0,harvest:0,water:0,fert:0,spray:0},plots:Array.from({length:20},(_,i)=>empty(i<12)),orders:O.slice(0,3).map((x,i)=>({id:i,name:x[0],need:x[1],reward:x[2]})),claimed:{},daily:{day:1,last:null}};const clone=x=>JSON.parse(JSON.stringify(x)),$=q=>document.querySelector(q);function load(){let old=null;for(const k of [K,'farmCloudV044','farmCloudV043','farmCloudV042','farmCloudV041'])try{let v=localStorage.getItem(k);if(v){old=JSON.parse(v);break}}catch{}let s=clone(def);if(old){Object.assign(s,old);s.inventory={...def.inventory,...(old.inventory||{})};s.inventory.seeds={...def.inventory.seeds,...(old.inventory?.seeds||{})};let pr=old.inventory?.produce||{};s.inventory.produce=clone(def.inventory.produce);for(let id in C){let v=pr[id];s.inventory.produce[id]=typeof v==='number'?v:v&&typeof v==='object'?Object.values(v).reduce((a,b)=>a+Number(b||0),0):0}}s.weather=W[s.weather]?s.weather:'sunny';if(!Array.isArray(s.forecast))s.forecast=[];s.forecast=s.forecast.filter(x=>W[x]).slice(0,2);while(s.forecast.length<2)s.forecast.push(randomWeather(s.forecast.at(-1)||s.weather));s.plots=(Array.isArray(s.plots)&&s.plots.length?s.plots:def.plots).slice(0,20).map((p,i)=>({...empty(i<12),...(p||{}),wateredStages:Array.isArray(p?.wateredStages)?p.wateredStages:(p?.watered?[0]:[]),checkedStages:Array.isArray(p?.checkedStages)?p.checkedStages:[]}));while(s.plots.length<20)s.plots.push(empty(s.plots.length<12));if(!Array.isArray(s.orders)||!s.orders.length)s.orders=clone(def.orders);s.claimed=s.claimed||{};s.daily=s.daily||{day:1,last:null};return s}let S=load();function save(){localStorage.setItem(K,JSON.stringify(S))}function msg(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove('show'),1400)}function xpNeed(){return 100+(S.lv-1)*35}function addXP(n){S.xp+=n;while(S.xp>=xpNeed()){S.xp-=xpNeed();S.lv++;S.maxEnergy=Math.min(40,S.maxEnergy+1);S.energy=S.maxEnergy;msg('🎉 Lên cấp '+S.lv)}}function regen(){let n=Math.floor((Date.now()-Number(S.lastEnergy||Date.now()))/60000);if(n>0){S.energy=Math.min(S.maxEnergy,S.energy+n);S.lastEnergy+=n*60000;save()}}function spend(){regen();if(S.energy<1){msg('⚡ Không đủ năng lượng');return false}S.energy--;save();return true}function si(q){return q<.16?0:q<.4?1:q<.72?2:q<1?3:4}function stage(q){return [['Gieo hạt','🟤'],['Mầm','🌱'],['Cây non','🌿'],['Trưởng thành','🌳'],['Thu hoạch',null]][si(q)]}function prog(p){if(!p.crop||!C[p.crop])return 0;let sp=W[S.weather][2]*(1+Math.min(3,p.wateredStages.length)*.07)*(p.fertilized?1.15:1)*(p.problem?.55:1);return Math.min(1,(Date.now()-p.plantedAt)/(C[p.crop][4]*1000/sp))}function risk(p,q){let st=si(q);if(!p.crop||st<1||st>3||p.checkedStages.includes(st))return;p.checkedStages.push(st);if(Math.random()<.08*W[S.weather][3]*(st===3?1.25:1)){p.problem=Math.random()<.65?'pest':'disease';msg(p.problem==='pest'?'🐛 Cây bị sâu!':'🦠 Cây bị bệnh!')}save()}const uc=i=>60+Math.max(0,i-12)*25;function plotClick(i){let p=S.plots[i];if(!p.unlocked){let c=uc(i);if(S.coin<c)return msg('Không đủ tiền');S.coin-=c;p.unlocked=true;save();render();return}if(!p.crop){let c=C[S.selected];if(!c||S.lv<c[6]||(S.inventory.seeds[S.selected]||0)<1)return msg('Không có hạt phù hợp');if(!spend())return;S.inventory.seeds[S.selected]--;Object.assign(p,empty(true),{crop:S.selected,plantedAt:Date.now()});S.stats.plant++;save();render();return}let q=prog(p);risk(p,q);if(q>=1&&!p.problem)return harvest(i);care(i)}function water(i){let p=S.plots[i],st=si(prog(p));if(st>=4||p.wateredStages.includes(st)||!spend())return;p.wateredStages.push(st);S.stats.water++;save();care(i);render()}function fert(i){let p=S.plots[i];if(p.fertilized)return;if(si(prog(p))<1)return msg('Chờ cây lên mầm');if(S.inventory.fertilizer<1)return msg('Hết phân');if(!spend())return;S.inventory.fertilizer--;p.fertilized=true;S.stats.fert++;save();care(i);render()}function spray(i){let p=S.plots[i];if(!p.problem)return;if(S.inventory.pesticide<1)return msg('Hết thuốc');if(!spend())return;S.inventory.pesticide--;p.problem=null;S.stats.spray++;save();care(i);render()}function harvest(i){let p=S.plots[i];if(!p.crop||prog(p)<1||p.problem||!spend())return;let id=p.crop;S.inventory.produce[id]=(S.inventory.produce[id]||0)+1;S.stats.harvest++;addXP(C[id][5]);Object.assign(p,empty(true));save();render();msg('✅ Thu hoạch '+C[id][0])}function care(i){let p=S.plots[i],q=prog(p),st=si(q),c=C[p.crop],sg=stage(q);$('#modal').classList.add('open');$('#mt').textContent=c[0]+' • '+sg[0];$('#mb').innerHTML=`<div class="help">Tiến độ <b>${Math.floor(q*100)}%</b>${p.problem?'<br>'+(p.problem==='pest'?'🐛 Sâu':'🦠 Bệnh'):''}</div><div class="row"><span>💧 Tưới giai đoạn này</span><button class="primary" onclick="water(${i})" ${st>=4||p.wateredStages.includes(st)?'disabled':''}>${p.wateredStages.includes(st)?'Đã tưới':'Tưới'}</button></div><div class="row"><span>✨ Bón phân (${S.inventory.fertilizer})</span><button class="primary" onclick="fert(${i})" ${p.fertilized?'disabled':''}>${p.fertilized?'Đã bón':'Bón'}</button></div><div class="row"><span>🧴 Thuốc (${S.inventory.pesticide})</span><button class="primary" onclick="spray(${i})" ${!p.problem?'disabled':''}>Phun</button></div>`}function renderPlots(){for(let p of S.plots)if(p.crop)risk(p,prog(p));$('#plots').innerHTML=S.plots.map((p,i)=>{if(!p.unlocked)return `<button class="plot locked" onclick="plotClick(${i})"><span class="tag">🔒 ${uc(i)} 🌿</span></button>`;if(!p.crop)return `<button class="plot" onclick="plotClick(${i})"></button>`;let q=prog(p),c=C[p.crop],sg=stage(q),ready=q>=1&&!p.problem,st=si(q),ico=q>=1?c[1]:sg[1];return `<button class="plot ${ready?'ready':''}" onclick="plotClick(${i})"><span class="tag">${ready?'THU HOẠCH':p.problem&&q>=1?'CẦN XỬ LÝ':Math.floor(q*100)+'%'}</span><span class="care">${p.wateredStages.includes(st)?'💧':''}${p.fertilized?'✨':''}</span><span class="problem">${p.problem?(p.problem==='pest'?'🐛':'🦠'):''}</span><span class="crop">${ico}</span><span class="stage">${q>=1?'Thu hoạch':sg[0]}</span><span class="grow"><i style="width:${q*100}%"></i></span></button>`}).join('')}function clockInfo(offsetMs=0){let d=new Date(Date.now()+offsetMs),h=d.getHours(),m=d.getMinutes();return{h,text:String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'),night:h<6||h>=18}}function phase(){let h=clockInfo().h;return h>=5&&h<7?'dawn':h>=7&&h<17?'day':h>=17&&h<19?'dusk':'night'}function weatherIcon(type,offset=0){let ci=clockInfo(offset),w=W[type]||W.sunny;if(!ci.night)return w[1];if(type==='rain')return'🌧️';if(type==='cloudy')return'☁️';return'🌙'}function weatherName(type,offset=0){let ci=clockInfo(offset),w=W[type]||W.sunny;if(!ci.night)return w[0];if(type==='rain')return'Mưa đêm';if(type==='cloudy')return'Đêm nhiều mây';return'Đêm quang'}function timeWeather(){document.body.className=phase();$('#clock').textContent=clockInfo().text;let i0=weatherIcon(S.weather,0),i1=weatherIcon(S.forecast[0],WT),i2=weatherIcon(S.forecast[1],WT*2);$('#weather').innerHTML=`${i0}<span class="forecastArrow">→</span>${i1}<span class="forecastArrow">→</span>${i2}`;$('#weather').title=weatherName(S.weather,0)+' → '+weatherName(S.forecast[0],WT)+' → '+weatherName(S.forecast[1],WT*2)}function weatherDetail(){$('#modal').classList.add('open');$('#mt').textContent='Dự báo thời tiết';$('#mb').innerHTML=`<div class="row"><span>Hiện tại</span><b>${weatherIcon(S.weather,0)} ${weatherName(S.weather,0)}</b></div><div class="row"><span>Tiếp theo</span><b>${weatherIcon(S.forecast[0],WT)} ${weatherName(S.forecast[0],WT)}</b></div><div class="row"><span>Sau đó</span><b>${weatherIcon(S.forecast[1],WT*2)} ${weatherName(S.forecast[1],WT*2)}</b></div><div class="help">Bản test: mỗi mốc thời tiết kéo dài khoảng 90 giây. Ban đêm sẽ không hiển thị nắng.</div>`}function rollWeather(){S.weather=S.forecast.shift();S.forecast.push(randomWeather(S.forecast.at(-1)||S.weather));S.weatherChangedAt=Date.now();save()}function maybeWeather(){let elapsed=Date.now()-Number(S.weatherChangedAt||0);if(elapsed<WT)return;let steps=Math.min(6,Math.floor(elapsed/WT));while(steps-->0)rollWeather()}function render(){regen();maybeWeather();$('#coin').textContent=S.coin;$('#lv').textContent=S.lv;$('#xp').style.width=Math.min(100,S.xp/xpNeed()*100)+'%';$('#energyTxt').textContent=S.energy+'/'+S.maxEnergy;$('#energy').style.width=S.energy/S.maxEnergy*100+'%';timeWeather();let seeds=Object.entries(C).filter(([id,c])=>S.lv>=c[6]&&(S.inventory.seeds[id]||0)>0);if(!seeds.some(([id])=>id===S.selected)&&seeds.length)S.selected=seeds[0][0];$('#tray').innerHTML=seeds.map(([id,c])=>`<button class="seed ${S.selected===id?'active':''}" onclick="S.selected='${id}';save();render()">${c[1]}<b>${S.inventory.seeds[id]}</b></button>`).join('');let qi=Q.findIndex((q,i)=>!S.claimed[i]);if(qi<0)qi=Q.length-1;let q=Q[qi];$('#mission').textContent=q[0]+' ('+Math.min(S.stats[q[1]]||0,q[2])+'/'+q[2]+')';renderPlots()}function toggleNav(){let t=$('#toolbar');t.classList.toggle('collapsed');$('#navToggle').textContent=t.classList.contains('collapsed')?'☰':'✕'}function total(id){return Number(S.inventory.produce[id]||0)}function openModal(type){$('#modal').classList.add('open');let t=$('#mt'),b=$('#mb');if(type==='shop'){t.textContent='Cửa hàng';b.innerHTML='<div class="grid">'+Object.entries(C).map(([id,c])=>`<div class="item"><b>${c[1]} ${c[0]}</b><p class="tiny">LV ${c[6]}</p><button class="primary" onclick="buySeed('${id}')" ${S.lv<c[6]?'disabled':''}>Mua 5 • ${c[2]*5}🌿</button></div>`).join('')+'<div class="item">✨ Phân bón<br><button class="primary" onclick="buyItem(\'fertilizer\',3,45)">Mua 3 • 45</button></div><div class="item">🧴 Thuốc<br><button class="primary" onclick="buyItem(\'pesticide\',3,60)">Mua 3 • 60</button></div></div>'}else if(type==='inventory'){t.textContent='Kho';let sr=Object.entries(C).filter(([id])=>S.inventory.seeds[id]>0).map(([id,c])=>`<div class="row"><span>${c[1]} ${c[0]}</span><b>${S.inventory.seeds[id]}</b></div>`).join(''),pr=Object.entries(C).filter(([id])=>total(id)>0).map(([id,c])=>`<div class="row"><span>${c[1]} ${c[0]}</span><span><b>${total(id)}</b> <button class="primary" onclick="sell('${id}')">Bán ${c[3]}🌿</button></span></div>`).join(''),su=(S.inventory.fertilizer?`<div class="row">✨ Phân bón <b>${S.inventory.fertilizer}</b></div>`:'')+(S.inventory.pesticide?`<div class="row">🧴 Thuốc <b>${S.inventory.pesticide}</b></div>`:'');b.innerHTML=`<h3>🌰 Hạt giống</h3>${sr||'<div class="help">Không có hạt giống.</div>'}<h3>🧺 Cây đã thu hoạch</h3>${pr||'<div class="help">Chưa có nông sản.</div>'}${su?'<h3>🧰 Vật tư</h3>'+su:''}`}else if(type==='orders'){t.textContent='Đơn hàng';b.innerHTML=S.orders.map((o,i)=>`<div class="row"><div><b>${o.name}</b><div class="tiny">${Object.entries(o.need).map(([id,n])=>C[id][1]+' '+n+' (có '+total(id)+')').join(' • ')}</div></div><button class="primary" onclick="completeOrder(${i})" ${Object.entries(o.need).every(([id,n])=>total(id)>=n)?'':'disabled'}>Giao<br>${o.reward}🌿</button></div>`).join('')}else if(type==='quests'){t.textContent='Nhiệm vụ';b.innerHTML=Q.map((q,i)=>{let cur=S.stats[q[1]]||0,cl=S.claimed[i];return `<div class="row"><div><b>${cl?'✅ ':''}${q[0]}</b><div class="tiny">${Math.min(cur,q[2])}/${q[2]} • ${q[3]}🌿</div></div><button class="primary" onclick="claimQ(${i})" ${cur<q[2]||cl?'disabled':''}>${cl?'Đã nhận':'Nhận'}</button></div>`}).join('')}else if(type==='daily'){t.textContent='Quà hằng ngày';let today=new Date().toDateString(),cl=S.daily.last===today;b.innerHTML='<div class="grid">'+D.map((r,i)=>`<div class="item">Ngày ${i+1}<br>🎁 ${r}🌿</div>`).join('')+`</div><p><button class="primary" onclick="claimDaily()" ${cl?'disabled':''}>${cl?'Đã nhận':'Nhận ngày '+S.daily.day}</button></p>`}else{t.textContent='Test';b.innerHTML='<div class="grid"><button class="primary" onclick="S.coin+=500;save();render()">+500🌿</button><button class="primary" onclick="S.energy=S.maxEnergy;save();render()">Đầy ⚡</button><button class="primary" onclick="advance()">+1 giai đoạn</button><button class="primary" onclick="nextW()">Đổi thời tiết</button><button class="primary" onclick="forceP()">Tạo sâu/bệnh</button><button class="primary" onclick="addSeeds()">+5 hạt</button><button class="primary" onclick="resetSave()">Reset save</button></div><p class="help">v0.5.0 • dự báo thời tiết dạng icon: hiện tại → kế tiếp → sau nữa.</p>'}}function closeModal(){$('#modal').classList.remove('open')}function buySeed(id){let c=C[id],cost=c[2]*5;if(S.coin<cost)return msg('Không đủ tiền');S.coin-=cost;S.inventory.seeds[id]+=5;save();openModal('shop');render()}function buyItem(k,n,cost){if(S.coin<cost)return msg('Không đủ tiền');S.coin-=cost;S.inventory[k]=(S.inventory[k]||0)+n;save();openModal('shop');render()}function sell(id){if(total(id)<1)return;S.inventory.produce[id]--;S.coin+=C[id][3];save();openModal('inventory');render()}function completeOrder(i){let o=S.orders[i];if(!Object.entries(o.need).every(([id,n])=>total(id)>=n))return;for(let[id,n]of Object.entries(o.need))S.inventory.produce[id]-=n;S.coin+=o.reward;addXP(Math.round(o.reward/8));let x=O[(Date.now()+i)%O.length];S.orders[i]={id:Date.now()+i,name:x[0],need:clone(x[1]),reward:x[2]};save();openModal('orders');render()}function claimQ(i){let q=Q[i];if(S.claimed[i]||(S.stats[q[1]]||0)<q[2])return;S.claimed[i]=true;S.coin+=q[3];addXP(Math.round(q[3]/4));save();openModal('quests');render()}function claimDaily(){let t=new Date().toDateString();if(S.daily.last===t)return;let r=D[Math.min(S.daily.day-1,6)];S.coin+=r;S.daily.last=t;S.daily.day=S.daily.day>=7?1:S.daily.day+1;save();openModal('daily');render()}function advance(){for(let p of S.plots)if(p.crop)p.plantedAt-=C[p.crop][4]*1000*.26;save();render()}function nextW(){rollWeather();render()}function forceP(){let p=S.plots.find(x=>x.crop);if(!p)return msg('Hãy trồng cây trước');p.problem=Math.random()<.5?'pest':'disease';save();render()}function addSeeds(){for(let k in S.inventory.seeds)S.inventory.seeds[k]+=5;save();render()}function resetSave(){for(let k of Object.keys(localStorage))if(k.startsWith('farmCloudV'))localStorage.removeItem(k);location.reload()}$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();setInterval(()=>{maybeWeather();timeWeather();renderPlots();regen();$('#energyTxt').textContent=S.energy+'/'+S.maxEnergy;$('#energy').style.width=S.energy/S.maxEnergy*100+'%'},1000);</script></body></html>
