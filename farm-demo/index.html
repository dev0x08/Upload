<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Nông Trại Mây v0.3.1</title>
<style>
:root{--cream:#fff4d8;--panel:#203f37ee;--gold:#ffd65b;--danger:#d85d52;--ok:#69a742}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(150deg,#b8efff,#fbe8ef);color:#fff;overflow:hidden}button{font:inherit}.game{height:100dvh;min-height:640px;position:relative;overflow:hidden}.card{background:var(--panel);border:1px solid #ffffff32;backdrop-filter:blur(12px);box-shadow:0 12px 28px #26473d33;border-radius:18px}.topbar{position:absolute;z-index:30;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.profile{display:flex;gap:9px;align-items:center;padding:7px 10px 7px 7px}.avatar{width:48px;height:48px;border-radius:14px;background:#ffe59a;display:grid;place-items:center;font-size:28px;border:2px solid #fff}.name{font-weight:900}.muted{font-size:10px;opacity:.78}.lvlrow{display:flex;align-items:center;gap:7px;margin-top:3px}.progress{width:120px;height:8px;background:#10261f;border-radius:99px;overflow:hidden}.progress i,.energyTrack i{height:100%;display:block}.progress i{background:linear-gradient(90deg,#ffe26c,#ffb944)}.rightHud{display:flex;gap:7px}.stat{padding:9px 11px;min-width:82px;text-align:center;font-weight:900}.energyBar{position:absolute;z-index:29;top:78px;left:14px;width:190px;padding:8px 10px}.energyTrack{height:7px;background:#10261f;border-radius:99px;overflow:hidden;margin-top:5px}.energyTrack i{background:linear-gradient(90deg,#6ed7ff,#55a6ff)}
.toolbar{position:absolute;z-index:35;left:50%;top:112px;transform:translateX(-50%);display:flex;gap:8px;padding:7px;border-radius:20px;background:#24453dbc;border:1px solid #ffffff28;backdrop-filter:blur(10px)}.tool{width:58px;height:52px;border:0;border-radius:15px;background:linear-gradient(#fff6cc,#f5c34e);box-shadow:0 5px #8a633c;color:#513a24;font-size:22px;cursor:pointer}.tool small{display:block;font-size:8px;font-weight:800}
.island{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:min(1040px,92vw);height:min(650px,64vh);border-radius:40% 38% 35% 42%/22% 25% 23% 27%;background:radial-gradient(circle at 48% 42%,#b9ef72 0 38%,#8bd153 65%,#5ba844 100%);box-shadow:0 22px 0 #4e8b42,0 38px 0 #317d83,0 52px 35px #254d5855}.plots{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:78%;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.plot{aspect-ratio:1.18;border:0;border-radius:16px;background:linear-gradient(145deg,#a46e44,#744526);box-shadow:inset 0 6px #ffffff10,0 6px #50321d50;position:relative;cursor:pointer;transition:.12s}.plot:active{transform:scale(.96)}.plot.locked{background:linear-gradient(145deg,#95d65c,#67af41);color:#fff}.locktxt{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:900;text-shadow:0 1px 2px #0008}.crop{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);font-size:34px}.ready .crop{animation:pulse .9s ease-in-out infinite}.tag{position:absolute;top:5px;left:50%;transform:translateX(-50%);background:#1f352fc9;padding:3px 6px;border-radius:99px;font-size:8px;white-space:nowrap}.grow{position:absolute;left:10%;right:10%;bottom:6px;height:5px;border-radius:8px;background:#271f1aa9;overflow:hidden}.grow i{display:block;height:100%;background:#ffd35c}.wet:before{content:'💧';position:absolute;right:4px;top:4px;font-size:13px}.fert:after{content:'✨';position:absolute;left:4px;top:4px;font-size:12px}
.bottom{position:absolute;z-index:32;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:flex-end;justify-content:space-between}.mission{padding:9px 12px;min-width:230px}.mission strong{display:block;font-size:12px}.tray{padding:7px;display:flex;gap:6px;max-width:62vw;overflow:auto}.seed{width:50px;height:50px;flex:0 0 auto;border:2px solid transparent;border-radius:14px;background:#ffffff16;color:#fff;font-size:23px;position:relative}.seed.active{border-color:var(--gold);background:#ffd85c20}.seed b{position:absolute;right:3px;bottom:2px;background:#172a25d8;border-radius:99px;font-size:8px;padding:2px 5px}
.modal{position:fixed;z-index:60;inset:0;background:#102c3388;display:none;place-items:center;padding:14px}.modal.open{display:grid}.panel{width:min(760px,96vw);max-height:88vh;overflow:auto;background:var(--cream);color:#503921;border-radius:24px;padding:18px;box-shadow:0 28px 70px #15363b66}.panelHead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;background:var(--cream);padding:6px 0 10px;z-index:3}.panel h2{margin:2px 0}.close{border:0;width:36px;height:36px;border-radius:50%;background:#674832;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{background:#fffaf0;border:1px solid #ead8b7;border-radius:16px;padding:12px;text-align:center}.item .icon{font-size:34px}.item h4{margin:4px 0}.item p{margin:3px 0;font-size:11px;color:#785f43}.item button,.primary{border:0;border-radius:10px;background:var(--ok);color:#fff;padding:8px 10px;font-weight:900;cursor:pointer}.danger{background:var(--danger)!important}.toast{position:fixed;z-index:90;top:92px;left:50%;transform:translateX(-50%);background:#18372fee;border:1px solid #ffffff30;padding:9px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1}.quest,.order,.invrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-radius:13px;background:#fffaf0;border:1px solid #ead8b7;margin:7px 0}.quest button[disabled],.order button[disabled]{opacity:.45}.tiny{font-size:10px;color:#795f40}.help{font-size:12px;line-height:1.45;background:#fffaf0;padding:10px;border-radius:12px}.daily{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:10px 5px;border-radius:12px;background:#fffaf0;border:1px solid #e6d6b8;text-align:center;font-size:11px}.storageBar{height:9px;background:#dfcba6;border-radius:99px;overflow:hidden;margin:8px 0}.storageBar i{display:block;height:100%;background:#7faf4d}.subtle{font-size:11px;color:#80684c}.empty{padding:18px;text-align:center;color:#8b765a;background:#fffaf0;border:1px dashed #d9c7a8;border-radius:14px}@keyframes pulse{50%{transform:translateX(-50%) scale(1.12);filter:drop-shadow(0 0 10px #fff187)}}
@media(max-width:850px){.plots{grid-template-columns:repeat(5,1fr);width:82%;gap:8px}.island{width:114vw;height:62vh;top:56%}.plot:nth-child(n+26){display:none}.grid{grid-template-columns:repeat(2,1fr)}.profile .progress{width:84px}.toolbar{top:116px}.tool{width:52px;height:48px}.daily{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.topbar{left:7px;right:7px}.rightHud .stat:nth-child(2){display:none}.energyBar{top:72px;width:165px}.toolbar{top:126px;gap:5px;padding:6px}.tool{width:50px;height:46px;font-size:20px}.plots{grid-template-columns:repeat(4,1fr);width:84%;gap:7px;top:54%}.plot:nth-child(n+21){display:none}.crop{font-size:28px}.seed{width:45px;height:45px}.mission{max-width:42vw;min-width:0;padding:8px}.grid{grid-template-columns:1fr}.panel{padding:14px}.avatar{width:42px;height:42px}.name{font-size:13px}.tray{max-width:55vw}.stat{min-width:70px;padding:8px}.daily{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="game">
<header class="topbar"><div class="profile card"><div class="avatar">👨‍🌾</div><div><div class="name">Trang trại thử nghiệm</div><div class="lvlrow"><span class="muted">LV <b id="lv">1</b></span><div class="progress"><i id="xpBar"></i></div></div></div></div><div class="rightHud"><div class="stat card">🌿 <span id="coin">0</span></div><div class="stat card">💎 <span id="gem">0</span></div></div></header>
<div class="energyBar card"><div class="muted">⚡ Năng lượng <b id="energyText"></b></div><div class="energyTrack"><i id="energyBar"></i></div></div>
<aside class="toolbar"><button class="tool" onclick="openModal('shop')">🏪<small>Shop</small></button><button class="tool" onclick="openModal('inventory')">🎒<small>Kho</small></button><button class="tool" onclick="openModal('orders')">📦<small>Đơn</small></button><button class="tool" onclick="openModal('quests')">📋<small>Nhiệm vụ</small></button><button class="tool" onclick="openModal('daily')">🎁<small>Ngày</small></button><button class="tool" onclick="openModal('settings')">🔧<small>Test</small></button></aside>
<section class="island"><div class="plots" id="plots"></div></section>
<footer class="bottom"><div class="mission card"><div class="muted">ĐANG THEO DÕI</div><strong id="missionTrack"></strong></div><div class="tray card" id="seedTray"></div></footer>
</main>
<div class="toast" id="toast"></div><div class="modal" id="modal"><section class="panel"><div class="panelHead"><div><div class="tiny">NÔNG TRẠI MÂY • V0.3.1 LOCAL TEST</div><h2 id="modalTitle"></h2></div><button class="close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></section></div>
<script>
const CROPS={corn:{name:'Bắp',icon:'🌽',buy:6,sell:15,grow:18,xp:8,level:1},carrot:{name:'Cà rốt',icon:'🥕',buy:9,sell:22,grow:25,xp:11,level:1},wheat:{name:'Lúa mì',icon:'🌾',buy:12,sell:30,grow:34,xp:14,level:2},tomato:{name:'Cà chua',icon:'🍅',buy:16,sell:39,grow:45,xp:18,level:3},strawberry:{name:'Dâu tây',icon:'🍓',buy:24,sell:58,grow:60,xp:25,level:4},pumpkin:{name:'Bí ngô',icon:'🎃',buy:34,sell:82,grow:80,xp:34,level:5}};
const QUESTS=[{id:'harvest3',title:'Thu hoạch 3 cây',type:'harvest',target:3,reward:60,xp:20},{id:'plant10',title:'Trồng 10 cây',type:'plant',target:10,reward:90,xp:30},{id:'sell5',title:'Bán 5 nông sản',type:'sell',target:5,reward:110,xp:35},{id:'unlock2',title:'Mở khóa 2 ô đất',type:'unlock',target:2,reward:150,xp:45}];
const DAILY_REWARDS=[40,55,70,90,120,160,250];
const ORDER_TEMPLATES=[{name:'Quán ăn trong làng',need:{corn:3,carrot:2},reward:120,xp:25},{name:'Chợ buổi sáng',need:{wheat:4,carrot:2},reward:165,xp:32},{name:'Nhà hàng ven sông',need:{tomato:3,corn:3},reward:210,xp:42},{name:'Lễ hội làng',need:{strawberry:2,pumpkin:1},reward:290,xp:55}];
const DEFAULT={coin:220,gem:5,lv:1,xp:0,energy:20,maxEnergy:20,lastEnergy:Date.now(),selected:'corn',storageLevel:1,storageCap:35,inventory:{seeds:{corn:8,carrot:5,wheat:2,tomato:0,strawberry:0,pumpkin:0},produce:{corn:0,carrot:0,wheat:0,tomato:0,strawberry:0,pumpkin:0},fertilizer:3},stats:{plant:0,harvest:0,sell:0,unlock:0},claimedQuests:{},plots:[],daily:{day:1,lastClaim:null},orders:[],orderSeed:0,version:31};
let S=load();
function clone(x){return JSON.parse(JSON.stringify(x))}function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))deepMerge(a[k],b[k]);else if(k!=='factory'&&k!=='animals'&&k!=='products')a[k]=b[k]}return a}
function generateOrders(){return Array.from({length:3},(_,i)=>{const t=ORDER_TEMPLATES[((S?.orderSeed||0)+i)%ORDER_TEMPLATES.length];return {id:Date.now()+i,name:t.name,need:clone(t.need),reward:t.reward,xp:t.xp}})}
function load(){let v=null;try{v=JSON.parse(localStorage.getItem('farmCloudV031')||localStorage.getItem('farmCloudV03')||localStorage.getItem('farmCloudV02')||'null')}catch{}const s=clone(DEFAULT);if(v)deepMerge(s,v);if(!s.plots.length)s.plots=Array.from({length:30},(_,i)=>({unlocked:i<12,crop:null,plantedAt:0,watered:false,fertilized:false}));S=s;if(!s.orders||!s.orders.length)s.orders=generateOrders();s.version=31;return s}
const $=q=>document.querySelector(q);function save(){localStorage.setItem('farmCloudV031',JSON.stringify(S))}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1500)}
function addXP(n){S.xp+=n;let need=100+Math.max(0,S.lv-1)*35;while(S.xp>=need){S.xp-=need;S.lv++;S.maxEnergy=Math.min(40,S.maxEnergy+1);S.energy=S.maxEnergy;toast('🎉 Lên cấp '+S.lv);need=100+(S.lv-1)*35}}
function regenEnergy(){const now=Date.now(),step=60000,add=Math.floor((now-S.lastEnergy)/step);if(add>0){S.energy=Math.min(S.maxEnergy,S.energy+add);S.lastEnergy+=add*step;save()}}function spendEnergy(n=1){regenEnergy();if(S.energy<n){toast('Không đủ năng lượng');return false}S.energy-=n;save();return true}
function storageUsed(){return Object.values(S.inventory.produce).reduce((a,b)=>a+b,0)}function hasSpace(n=1){return storageUsed()+n<=S.storageCap}
function growth(p){if(!p.crop)return 0;const c=CROPS[p.crop];let mult=1;if(p.watered)mult*=.82;if(p.fertilized)mult*=.72;return Math.min(1,(Date.now()-p.plantedAt)/(c.grow*1000*mult))}
function plotClick(i){const p=S.plots[i];if(!p.unlocked){const idx=S.plots.filter(x=>x.unlocked).length,cost=60+(idx-12)*28,needLv=1+Math.floor(Math.max(0,idx-12)/3);if(S.lv<needLv)return toast('Cần LV '+needLv);if(S.coin<cost)return toast('Cần '+cost+' 🌿');S.coin-=cost;p.unlocked=true;S.stats.unlock++;save();render();return toast('Đã mở ô đất')}if(p.crop){const g=growth(p);if(g>=1){if(!hasSpace())return toast('Kho đầy');if(!spendEnergy())return;const c=CROPS[p.crop];S.inventory.produce[p.crop]++;S.stats.harvest++;addXP(c.xp);p.crop=null;p.plantedAt=0;p.watered=false;p.fertilized=false;save();render();return toast('Thu hoạch '+c.icon)}if(!p.watered){if(!spendEnergy())return;p.watered=true;save();render();return toast('💧 Đã tưới')}if(!p.fertilized&&S.inventory.fertilizer>0){S.inventory.fertilizer--;p.fertilized=true;save();render();return toast('✨ Đã bón phân')}return toast('Cây đang lớn')}const c=CROPS[S.selected];if(S.lv<c.level)return toast('Cần LV '+c.level);if((S.inventory.seeds[S.selected]||0)<=0)return toast('Hết hạt giống');if(!spendEnergy())return;S.inventory.seeds[S.selected]--;p.crop=S.selected;p.plantedAt=Date.now();p.watered=false;p.fertilized=false;S.stats.plant++;save();render()}
function renderPlots(){const el=$('#plots');el.innerHTML=S.plots.map((p,i)=>{if(!p.unlocked){const idx=S.plots.filter((x,j)=>j<i&&x.unlocked).length,cost=60+Math.max(0,idx-12)*28;return `<button class="plot locked" onclick="plotClick(${i})"><span class="locktxt">🔒<br>${cost} 🌿</span></button>`}if(!p.crop)return `<button class="plot" onclick="plotClick(${i})"></button>`;const c=CROPS[p.crop],g=growth(p),ready=g>=1,icon=g<.33?'🌱':g<.7?'🌿':c.icon;return `<button class="plot ${ready?'ready':''} ${p.watered?'wet':''} ${p.fertilized?'fert':''}" onclick="plotClick(${i})"><span class="tag">${ready?'THU HOẠCH':Math.ceil((1-g)*c.grow)+'s'}</span><span class="crop">${icon}</span><span class="grow"><i style="width:${g*100}%"></i></span></button>`}).join('')}
function visibleSeeds(){return Object.entries(CROPS).filter(([id,c])=>S.lv>=c.level&&(S.inventory.seeds[id]||0)>0)}
function render(){regenEnergy();$('#coin').textContent=S.coin;$('#gem').textContent=S.gem;$('#lv').textContent=S.lv;const need=100+(S.lv-1)*35;$('#xpBar').style.width=Math.min(100,S.xp/need*100)+'%';$('#energyText').textContent=S.energy+'/'+S.maxEnergy;$('#energyBar').style.width=S.energy/S.maxEnergy*100+'%';const seeds=visibleSeeds();if(!seeds.some(([id])=>id===S.selected)&&seeds.length)S.selected=seeds[0][0];$('#seedTray').innerHTML=seeds.length?seeds.map(([id,c])=>`<button class="seed ${S.selected===id?'active':''}" onclick="S.selected='${id}';save();render()">${c.icon}<b>${S.inventory.seeds[id]}</b></button>`).join(''):`<span class="muted" style="padding:12px">Hết hạt</span>`;const q=QUESTS.find(q=>!S.claimedQuests[q.id])||QUESTS[QUESTS.length-1];$('#missionTrack').textContent=q.title+' ('+Math.min(S.stats[q.type]||0,q.target)+'/'+q.target+')';renderPlots()}
function openModal(type){const m=$('#modal');m.classList.add('open');const body=$('#modalBody'),title=$('#modalTitle');if(type==='shop'){title.textContent='Cửa hàng';body.innerHTML=renderShop()}if(type==='inventory'){title.textContent='Kho đồ';body.innerHTML=renderInventory()}if(type==='orders'){title.textContent='Đơn hàng nông trại';body.innerHTML=renderOrders()}if(type==='quests'){title.textContent='Nhiệm vụ';body.innerHTML=renderQuests()}if(type==='daily'){title.textContent='Thưởng hằng ngày';body.innerHTML=renderDaily()}if(type==='settings'){title.textContent='Công cụ test';body.innerHTML=renderSettings()}}function closeModal(){$('#modal').classList.remove('open');render()}function refresh(t){openModal(t)}
function renderShop(){return `<div class="grid">${Object.entries(CROPS).map(([id,c])=>`<div class="item"><div class="icon">${c.icon}</div><h4>${c.name}</h4><p>LV ${c.level} • ${c.grow}s • bán ${c.sell}</p><button onclick="buySeed('${id}')" ${S.lv<c.level?'disabled':''}>Mua 5 • ${c.buy*5} 🌿</button></div>`).join('')}<div class="item"><div class="icon">✨</div><h4>Phân bón</h4><p>Tăng tốc cây</p><button onclick="buyFertilizer()">Mua 3 • 45 🌿</button></div></div>`}function buySeed(id){const c=CROPS[id],price=c.buy*5;if(S.lv<c.level)return toast('Chưa đủ level');if(S.coin<price)return toast('Không đủ tiền');S.coin-=price;S.inventory.seeds[id]=(S.inventory.seeds[id]||0)+5;save();refresh('shop')}function buyFertilizer(){if(S.coin<45)return toast('Không đủ tiền');S.coin-=45;S.inventory.fertilizer+=3;save();refresh('shop')}
function renderInventory(){const used=storageUsed(),pct=Math.min(100,used/S.storageCap*100);const rows=Object.entries(CROPS).filter(([id])=>(S.inventory.seeds[id]||0)>0||(S.inventory.produce[id]||0)>0).map(([id,c])=>{const seed=S.inventory.seeds[id]||0,produce=S.inventory.produce[id]||0;const parts=[];if(seed>0)parts.push(`Hạt <b>${seed}</b>`);if(produce>0)parts.push(`Nông sản <b>${produce}</b>`);return `<div class="invrow"><span>${c.icon} ${c.name}</span><span>${parts.join(' • ')} ${produce>0?`<button class="primary" onclick="sellProduce('${id}')">Bán</button>`:''}</span></div>`}).join('');const fert=S.inventory.fertilizer>0?`<div class="invrow"><span>✨ Phân bón</span><b>${S.inventory.fertilizer}</b></div>`:'';const cost=180*S.storageLevel;return `<div class="help"><b>Kho ${used}/${S.storageCap}</b><div class="storageBar"><i style="width:${pct}%"></i></div><button class="primary" onclick="upgradeStorage()">Nâng +15 chỗ • ${cost} 🌿</button></div>${rows||'<div class="empty">Kho đang trống.</div>'}${fert}`}
function upgradeStorage(){const cost=180*S.storageLevel;if(S.coin<cost)return toast('Không đủ tiền');S.coin-=cost;S.storageLevel++;S.storageCap+=15;save();refresh('inventory')}function sellProduce(id){if((S.inventory.produce[id]||0)<1)return toast('Không có hàng');S.inventory.produce[id]--;S.coin+=CROPS[id].sell;S.stats.sell++;save();refresh('inventory')}
function orderReady(o){for(const k in o.need)if((S.inventory.produce[k]||0)<o.need[k])return false;return true}function orderText(o){return Object.entries(o.need).map(([k,v])=>CROPS[k].icon+' '+v).join(' • ')}function renderOrders(){return `<div class="help">Đơn hàng hiện chỉ dùng nông sản thô. Chế biến và chăn nuôi đang tạm dừng để hoàn thiện phần nông trại trước.</div>${S.orders.map((o,i)=>`<div class="order"><div><b>${o.name}</b><div class="subtle">${orderText(o)}</div><div class="tiny">${o.reward} 🌿 • ${o.xp} EXP</div></div><button class="primary" ${orderReady(o)?'':'disabled'} onclick="completeOrder(${i})">Giao</button></div>`).join('')}`}
function completeOrder(i){const o=S.orders[i];if(!orderReady(o))return;for(const k in o.need)S.inventory.produce[k]-=o.need[k];S.coin+=o.reward;addXP(o.xp);S.orderSeed++;const t=ORDER_TEMPLATES[S.orderSeed%ORDER_TEMPLATES.length];S.orders.splice(i,1,{id:Date.now(),name:t.name,need:clone(t.need),reward:t.reward,xp:t.xp});save();refresh('orders');toast('📦 Đã giao đơn')}
function renderQuests(){return QUESTS.map(q=>{const cur=S.stats[q.type]||0,done=cur>=q.target,claimed=!!S.claimedQuests[q.id];return `<div class="quest"><div><b>${q.title}</b><div class="subtle">${Math.min(cur,q.target)}/${q.target} • ${q.reward} 🌿 • ${q.xp} EXP</div></div><button class="primary" ${done&&!claimed?'':'disabled'} onclick="claimQuest('${q.id}')">${claimed?'Đã nhận':'Nhận'}</button></div>`}).join('')}function claimQuest(id){const q=QUESTS.find(x=>x.id===id);if(!q||S.claimedQuests[id]||(S.stats[q.type]||0)<q.target)return;S.claimedQuests[id]=true;S.coin+=q.reward;addXP(q.xp);save();refresh('quests')}
function renderDaily(){const today=new Date().toDateString(),claimed=S.daily.lastClaim===today;return `<div class="daily">${DAILY_REWARDS.map((v,i)=>`<div class="day"><b>Ngày ${i+1}</b><div>🎁 ${v}</div></div>`).join('')}</div><div style="margin-top:12px"><button class="primary" ${claimed?'disabled':''} onclick="claimDaily()">${claimed?'Đã nhận hôm nay':'Nhận quà ngày '+S.daily.day}</button></div>`}function claimDaily(){const today=new Date().toDateString();if(S.daily.lastClaim===today)return;S.coin+=DAILY_REWARDS[Math.min(S.daily.day-1,6)];S.daily.lastClaim=today;S.daily.day=S.daily.day>=7?1:S.daily.day+1;save();refresh('daily')}
function renderSettings(){return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="primary" onclick="S.coin+=500;save();refresh('settings')">+500 🌿</button><button class="primary" onclick="S.energy=S.maxEnergy;save();refresh('settings')">Nạp đầy ⚡</button><button class="primary" onclick="testSeeds()">+5 hạt mỗi loại</button><button class="primary" onclick="finishCrops()">Hoàn tất cây</button></div><hr><div class="help">Save localStorage: <b>farmCloudV031</b><br>Chưa Firebase. Chăn nuôi và chế biến đã tạm ẩn khỏi gameplay.</div><button class="primary danger" onclick="resetGame()">Xóa save local</button>`}function testSeeds(){for(const k in S.inventory.seeds)S.inventory.seeds[k]+=5;save();refresh('settings')}function finishCrops(){for(const p of S.plots)if(p.crop)p.plantedAt=Date.now()-999999;save();refresh('settings')}function resetGame(){if(confirm('Xóa save local và chơi lại?')){localStorage.removeItem('farmCloudV031');localStorage.removeItem('farmCloudV03');localStorage.removeItem('farmCloudV02');location.reload()}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();setInterval(()=>{regenEnergy();renderPlots();$('#energyText').textContent=S.energy+'/'+S.maxEnergy;$('#energyBar').style.width=S.energy/S.maxEnergy*100+'%'},1000);
</script>
</body>
</html>
