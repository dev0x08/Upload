const $=q=>document.querySelector(q),now=()=>Date.now(),empty=u=>({unlocked:u,crop:null,g:0,last:now(),water:[],fert:false,prob:null,check:[],mut:false,mutCheck:false,h:0}),clone=x=>JSON.parse(JSON.stringify(x));function obj(){let seeds={},prod={};for(let id in C){seeds[id]=0;prod[id]=0;prod['m_'+id]=0}Object.assign(seeds,{corn:8,carrot:5,wheat:2});return{coin:220,lv:1,xp:0,en:20,max:20,lastEn:now(),sel:'corn',weather:'sunny',forecast:['cloudy','rain'],weatherAt:now(),rare:null,inv:{seeds,prod,fertilizer:3,pesticide:2},stats:{plant:0,harvest:0,water:0,fert:0,spray:0,mutant:0},plots:Array.from({length:20},(_,i)=>empty(i<12)),orders:[],claimed:{}}}function rareIds(){return Object.keys(C).filter(id=>C[id][11]==='rare')}function newRare(){let a=rareIds().sort(()=>Math.random()-.5),stock={};a.slice(0,3).forEach(id=>stock[id]=C[id][12]||3);return{ids:a.slice(0,3),stock,at:now()}}let S;function order(){let ids=Object.keys(C).filter(id=>C[id][11]==='normal'&&C[id][5]<=S.lv),need={},n=Math.random()<.55?2:1;ids=ids.length?ids:['corn','carrot'];while(n--){let id=ids[Math.floor(Math.random()*ids.length)];need[id]=(need[id]||0)+1+Math.floor(Math.random()*3)}let base=Object.entries(need).reduce((a,[id,q])=>a+C[id][3]*q,0),ttl=OMIN+Math.random()*(OMAX-OMIN);return{name:NAMES[Math.floor(Math.random()*NAMES.length)],need,reward:Math.max(40,Math.round(base*1.65)),exp:now()+ttl}}function load(){let d=obj(),old=null;for(let k of [K,'farmCloudV082','farmCloudV080','farmCloudV072','farmCloudV071'])try{let v=localStorage.getItem(k);if(v){old=JSON.parse(v);break}}catch{}if(old){Object.assign(d,old);d.inv={...d.inv,...(old.inv||old.inventory||{})};d.inv.seeds={...obj().inv.seeds,...(old.inv?.seeds||old.inventory?.seeds||{})};d.inv.prod={...obj().inv.prod,...(old.inv?.prod||old.inventory?.produce||{})};d.en=old.en??old.energy??d.en;d.max=old.max??old.maxEnergy??d.max;d.lastEn=old.lastEn??old.lastEnergy??d.lastEn;d.sel=old.sel??old.selected??d.sel;d.weatherAt=old.weatherAt??old.weatherChangedAt??d.weatherAt;d.stats={...d.stats,...old.stats};d.plots=(old.plots||d.plots).slice(0,20).map((p,i)=>({...empty(i<12),...p,g:p.g??p.growthMs??0,last:now(),water:p.water??p.wateredStages??[],fert:p.fert??p.fertilized??false,prob:p.prob??p.problem??null,check:p.check??p.checkedStages??[],mut:p.mut??p.mutated??false,mutCheck:p.mutCheck??p.mutationChecked??false,h:p.h??p.harvestNo??0}));while(d.plots.length<20)d.plots.push(empty(false))}S=d;S.weather=W[S.weather]?S.weather:'sunny';if(!Array.isArray(S.forecast))S.forecast=[];S.forecast=S.forecast.filter(x=>W[x]).slice(0,2);while(S.forecast.length<2)S.forecast.push(Object.keys(W)[Math.floor(Math.random()*4)]);if(!S.rare||!Array.isArray(S.rare.ids)||!S.rare.stock||!Number.isFinite(Number(S.rare.at)))S.rare=newRare();if(!Array.isArray(S.orders))S.orders=[];S.orders=S.orders.filter(o=>o&&o.need&&Number.isFinite(Number(o.exp))).slice(0,3);while(S.orders.length<3)S.orders.push(order());S.claimed=S.claimed||{};return S}S=load();function save(){localStorage.setItem(K,JSON.stringify(S))}function msg(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove('show'),1400)}function needXP(){return 100+(S.lv-1)*35}function addXP(n){S.xp+=n;while(S.xp>=needXP()){S.xp-=needXP();S.lv++;S.max=Math.min(40,S.max+1);S.en=S.max}}function regen(){let n=Math.floor((now()-S.lastEn)/60000);if(n>0){S.en=Math.min(S.max,S.en+n);S.lastEn+=n*60000}}function spend(){regen();if(S.en<1){msg('⚡ Hết năng lượng');return false}S.en--;return true}function si(q){return q<.16?0:q<.4?1:q<.72?2:q<1?3:4}function sg(q){return [['Gieo hạt','🟤'],['Mầm','🌱'],['Cây non','🌿'],['Trưởng thành','🌳'],['Thu hoạch','']][si(q)]}function prog(p){if(!p.crop)return 0;return Math.min(1,p.g/(C[p.crop][4]*1000))}function tick(p){if(!p.crop)return;let t=now(),dt=Math.min(2000,t-p.last);p.last=t;let q=prog(p),st=si(q);if(st>=4||!p.water.includes(st))return;let c=C[p.crop],speed=W[S.weather][2]*(S.weather===c[6]?1.18:1)*(p.fert?1.15:1)*(p.prob?0.55:1);p.g=Math.min(p.g+dt*speed,ENDS[st]*c[4]*1000)}function mutate(p,q){if(!p.crop||p.mutCheck||q<.72)return;p.mutCheck=true;let c=C[p.crop];if(Math.random()<c[10]*(p.fert?1.15:1)){p.mut=true;S.stats.mutant++;msg('🧬 Cây đột biến!')}}function risk(p,q){let st=si(q);if(!p.crop||st<1||st>3||p.check.includes(st))return;p.check.push(st);let c=C[p.crop];if(Math.random()<.08*W[S.weather][3]*(S.weather===c[6]?0.75:1))p.prob=Math.random()<.65?'pest':'disease'}function firstLocked(){return S.plots.findIndex(p=>!p.unlocked)}function firstEmpty(){return S.plots.findIndex(p=>p.unlocked&&!p.crop)}function clickPlot(i){let p=S.plots[i];if(!p.unlocked){if(i!==firstLocked())return msg('🔒 Mở ô theo thứ tự');let cost=60+Math.max(0,i-12)*25;if(S.coin<cost)return msg('Không đủ tiền');S.coin-=cost;p.unlocked=true;save();return render()}if(!p.crop){if(i!==firstEmpty())return msg('🌱 Trồng theo thứ tự');let c=C[S.sel];if(!c||c[5]>S.lv||(S.inv.seeds[S.sel]||0)<1)return msg('Không có hạt phù hợp');if(!spend())return;S.inv.seeds[S.sel]--;Object.assign(p,empty(true),{crop:S.sel});S.stats.plant++;save();return render()}tick(p);let q=prog(p);mutate(p,q);risk(p,q);if(q>=1&&!p.prob)return harvest(i);care(i)}function water(i){let p=S.plots[i],st=si(prog(p));if(st>=4||p.water.includes(st)||!spend())return;p.water.push(st);p.last=now();S.stats.water++;save();care(i);render()}function fert(i){let p=S.plots[i];if(p.fert||si(prog(p))<1)return;if(S.inv.fertilizer<1)return msg('Hết phân');if(!spend())return;S.inv.fertilizer--;p.fert=true;S.stats.fert++;save();care(i);render()}function spray(i){let p=S.plots[i];if(!p.prob||S.inv.pesticide<1||!spend())return;S.inv.pesticide--;p.prob=null;S.stats.spray++;save();care(i);render()}function harvest(i){let p=S.plots[i],id=p.crop,c=C[id];if(prog(p)<1||p.prob||!spend())return;let k=p.mut?'m_'+id:id;S.inv.prod[k]=(S.inv.prod[k]||0)+1;S.stats.harvest++;addXP(c[5]*5);let left=c[7]-(p.h+1);if(left>0){p.h++;p.g=.72*c[4]*1000;p.water=[0,1,2];p.fert=false;p.prob=null;p.check=[];p.mut=false;p.mutCheck=false;p.last=now()}else Object.assign(p,empty(true));save();render()}function askCut(i){confirmBox('Chặt bỏ cây','Cây sẽ mất hoàn toàn.','cut('+i+')')}function cut(i){Object.assign(S.plots[i],empty(true));save();closeModal();render()}function badge(r){return r==='rare'?'<span class="badge rare">HIẾM</span>':r==='mut'?'<span class="badge mut">ĐỘT BIẾN</span>':'<span class="badge">THƯỜNG</span>'}function care(i){let p=S.plots[i],q=prog(p),st=si(q),c=C[p.crop],need=st<4&&!p.water.includes(st),s=sg(q),left=Math.max(0,c[7]-p.h),status=p.prob?[p.prob==='pest'?'🐛 Sâu bệnh':'🦠 Bệnh cây','bad']:need?['💧 Cần tưới','warn']:['✓ Đang lớn','good'];$('#modal').classList.add('open');$('#mt').textContent='Chăm sóc cây';$('#mb').innerHTML=`<div class="careHero"><div class="careIcon">${p.mut?'🧬':c[1]}</div><div class="careMain"><div class="careName">${p.mut?c[8]:c[0]}</div><div class="chips">${badge(p.mut?'mut':c[11])}<span class="chip ${status[1]}">${status[0]}</span><span class="chip">${s[0]}</span>${c[7]>1?`<span class="chip">Còn ${left} lứa</span>`:''}</div></div></div><div class="progressRow"><span>Tiến độ</span><span>${Math.floor(q*100)}%</span></div><div class="progress"><i style="width:${q*100}%"></i></div><div class="tiny" style="margin:7px 2px 10px">Ưa ${W[c[6]][1]} ${W[c[6]][0]} • phải tưới mỗi giai đoạn</div>${(need||(!p.fert&&st>=1&&st<4)||p.prob)?`<div class="actions">${need?`<div class="act water"><div><b>💧 Tưới nước</b><small>Cho cây tiếp tục lớn</small></div><button class="primary" onclick="water(${i})">Tưới</button></div>`:''}${!p.fert&&st>=1&&st<4?`<div class="act"><div><b>✨ Phân bón</b><small>Còn ${S.inv.fertilizer}</small></div><button class="primary" onclick="fert(${i})">Bón</button></div>`:''}${p.prob?`<div class="act"><div><b>${p.prob==='pest'?'🐛':'🦠'} Xử lý sâu bệnh</b><small>Còn ${S.inv.pesticide} thuốc</small></div><button class="primary" onclick="spray(${i})">Phun</button></div>`:''}</div>`:''}<button class="danger" style="width:100%;margin-top:10px" onclick="askCut(${i})">🪓 Chặt bỏ cây</button>`}
function renderPlots(){for(let p of S.plots)if(p.crop){tick(p);let q=prog(p);mutate(p,q);risk(p,q)}let fl=firstLocked(),fe=firstEmpty();$('#plots').innerHTML=S.plots.map((p,i)=>{if(!p.unlocked)return `<button class="plot locked ${i===fl?'next':'wait'}" onclick="clickPlot(${i})"><span class="tag">${i===fl?'🔓 '+(60+Math.max(0,i-12)*25)+' 🌿':'🔒'}</span></button>`;if(!p.crop)return `<button class="plot ${i===fe?'next':'wait'}" onclick="clickPlot(${i})"></button>`;let q=prog(p),c=C[p.crop],st=si(q),s=sg(q),need=st<4&&!p.water.includes(st);return `<button class="plot ${p.mut?'mut':c[11]==='rare'?'rare':''}" onclick="clickPlot(${i})"><span class="tag">${q>=1&&!p.prob?'THU HOẠCH':need?'💧 CẦN TƯỚI':Math.floor(q*100)+'%'}</span><span class="problem">${p.prob?(p.prob==='pest'?'🐛':'🦠'):''}</span><span class="crop">${p.mut?'🧬':q>=1?c[1]:s[1]}</span><span class="stage">${q>=1?'Thu hoạch':s[0]}</span><span class="grow"><i style="width:${q*100}%"></i></span></button>`}).join('')}
function weatherIcon(t,off=0){let h=new Date(now()+off).getHours(),night=h<6||h>=18;if(!night)return W[t][1];if(t==='rain')return'🌧️';if(t==='cloudy')return'☁️';return'🌙'}function timeWeather(){let d=new Date(),h=d.getHours();$('#clock').textContent=String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');$('#weather').innerHTML=`${weatherIcon(S.weather)} → ${weatherIcon(S.forecast[0],WT)}`}function rollWeather(){S.weather=S.forecast.shift();S.forecast.push(Object.keys(W)[Math.floor(Math.random()*4)]);S.weatherAt=now()}function refresh(){if(now()-S.weatherAt>=WT)rollWeather();if(now()-S.rare.at>=SHOP)S.rare=newRare();S.orders=S.orders.map(o=>now()>=o.exp?order():o)}function render(){regen();refresh();$('#coin').textContent=S.coin;$('#lv').textContent=S.lv;$('#xp').style.width=Math.min(100,S.xp/needXP()*100)+'%';$('#en').textContent=S.en+'/'+S.max;timeWeather();let a=Object.entries(C).filter(([id,c])=>c[5]<=S.lv&&(S.inv.seeds[id]||0)>0);if(!a.some(([id])=>id===S.sel)&&a.length)S.sel=a[0][0];$('#tray').innerHTML=a.map(([id,c])=>`<button class="seed ${S.sel===id?'active':''}" onclick="S.sel='${id}';save();render()">${c[1]}<b>${S.inv.seeds[id]}</b></button>`).join('');renderPlots();save()}
function cropCard(id,c,rare=false){let stock=rare?S.rare.stock[id]||0:999;return `<div class="item"><b>${c[1]} ${c[0]}</b><br>${badge(c[11])}<div class="tiny">LV${c[5]} • ${c[4]}s • bán ${c[3]}🌿${rare?' • còn '+stock:''}</div><input class="qty" id="buy_${id}" type="number" min="1" max="${stock}" value="1"><button class="primary" onclick="askBuy('${id}')" ${c[5]>S.lv||stock<1?'disabled':''}>Mua</button></div>`}function openModal(t){$('#modal').classList.add('open');let h=$('#mt'),b=$('#mb');if(t==='shop'){h.textContent='Cửa hàng';let norm=Object.entries(C).filter(([,c])=>c[11]==='normal'),rare=S.rare.ids.map(id=>[id,C[id]]);b.innerHTML=`<h3>🌱 Hạt giống thường</h3><div class="grid">${norm.map(x=>cropCard(...x)).join('')}</div><h3>💎 Hạt giống hiếm</h3><div class="grid">${rare.map(x=>cropCard(...x,true)).join('')}</div><h3>🧰 Vật tư</h3><div class="grid"><div class="item">✨ Phân bón<br>15🌿<br><input class="qty" id="mat_fertilizer" value="1" type="number"><button class="primary" onclick="askMat('fertilizer','Phân bón',15)">Mua</button></div><div class="item">🧴 Thuốc sâu<br>20🌿<br><input class="qty" id="mat_pesticide" value="1" type="number"><button class="primary" onclick="askMat('pesticide','Thuốc sâu',20)">Mua</button></div></div>`}else if(t==='inv'){h.textContent='Kho';let seeds=Object.entries(C).filter(([id])=>S.inv.seeds[id]>0).map(([id,c])=>rowSellSeed(id,c)).join(''),prod=[];for(let[id,c]of Object.entries(C)){if(S.inv.prod[id]>0)prod.push(rowProd(id,c,false));if(S.inv.prod['m_'+id]>0)prod.push(rowProd(id,c,true))}b.innerHTML=`<h3>🌰 Hạt giống</h3>${seeds||'<div class="row">Không có hạt</div>'}<h3>🧺 Nông sản</h3>${prod.join('')||'<div class="row">Chưa có nông sản</div>'}<h3>🧰 Vật tư</h3>${rowMat('fertilizer','✨ Phân bón',9)}${rowMat('pesticide','🧴 Thuốc sâu',14)}`}else if(t==='orders'){h.textContent='Đơn hàng';b.innerHTML=S.orders.map((o,i)=>`<div class="row"><div><b>${o.name}</b><div class="tiny">${Object.entries(o.need).map(([id,n])=>C[id][1]+' '+n+' (có '+(S.inv.prod[id]||0)+')').join(' • ')}</div><div class="orderTime">⏱ ${fmt(o.exp-now())}</div></div><button class="primary" onclick="doneOrder(${i})" ${Object.entries(o.need).every(([id,n])=>(S.inv.prod[id]||0)>=n)?'':'disabled'}>Giao<br>${o.reward}🌿</button></div>`).join('')}else if(t==='quests'){h.textContent='Nhiệm vụ';b.innerHTML=Q.map((q,i)=>`<div class="row"><div>${S.claimed[i]?'✅ ':''}<b>${q[0]}</b><div class="tiny">${Math.min(S.stats[q[1]]||0,q[2])}/${q[2]} • ${q[3]}🌿</div></div><button class="primary" onclick="claim(${i})" ${(S.stats[q[1]]||0)<q[2]||S.claimed[i]?'disabled':''}>Nhận</button></div>`).join('')}else{h.textContent='Test';b.innerHTML='<div class="grid"><button class="primary" onclick="S.coin+=500;render()">+500🌿</button><button class="primary" onclick="S.en=S.max;render()">Đầy ⚡</button><button class="primary" onclick="addSeeds()">+5 hạt</button><button class="primary" onclick="S.orders=[order(),order(),order()];openModal(\'orders\')">Đổi đơn</button><button class="primary" onclick="localStorage.clear();location.reload()">Reset</button></div>'}}
function closeModal(){$('#modal').classList.remove('open')}function confirmBox(t,x,a){$('#modal').classList.add('open');$('#mt').textContent=t;$('#mb').innerHTML=`<div class="row">${x}</div><div style="display:flex;justify-content:flex-end;gap:8px"><button class="ghost" onclick="closeModal()">Hủy</button><button class="primary" onclick="${a}">Xác nhận</button></div>`}function qty(id,max=999){return Math.max(1,Math.min(max,parseInt($(id)?.value||1)||1))}function askBuy(id){let c=C[id],max=c[11]==='rare'?S.rare.stock[id]||0:999,q=qty('#buy_'+id,max);if(max<1)return;confirmBox('Xác nhận mua',`Mua <b>${q}</b> hạt ${c[0]} giá <b>${q*c[2]}🌿</b>?`,`buy('${id}',${q})`)}function buy(id,q){let c=C[id],cost=c[2]*q;if(S.coin<cost)return msg('Không đủ tiền');if(c[11]==='rare'&&(S.rare.stock[id]||0)<q)return;S.coin-=cost;S.inv.seeds[id]+=q;if(c[11]==='rare')S.rare.stock[id]-=q;save();openModal('shop');render()}function askMat(k,n,p){let q=qty('#mat_'+k);confirmBox('Xác nhận mua',`Mua <b>${q}</b> ${n} giá <b>${q*p}🌿</b>?`,`buyMat('${k}',${q},${p})`)}function buyMat(k,q,p){if(S.coin<q*p)return msg('Không đủ tiền');S.coin-=q*p;S.inv[k]+=q;save();openModal('shop');render()}function rowSellSeed(id,c){let n=S.inv.seeds[id],p=Math.max(1,Math.round(c[2]*(c[11]==='rare'?.8:.7)));return `<div class="row"><span>${c[1]} ${c[0]}<br><small>Thu hồi ${p}🌿</small></span><span><b>${n}</b> <input class="qty" id="ss_${id}" value="1" type="number"><button class="primary" onclick="sellSeed('${id}',${p})">Bán</button></span></div>`}function sellSeed(id,p){let q=qty('#ss_'+id,S.inv.seeds[id]);confirmBox('Bán hạt',`Bán ${q} hạt nhận ${q*p}🌿?`,`doSellSeed('${id}',${q},${p})`)}function doSellSeed(id,q,p){S.inv.seeds[id]-=q;S.coin+=q*p;save();openModal('inv');render()}function rowProd(id,c,m){let k=m?'m_'+id:id,n=S.inv.prod[k],p=m?c[9]:c[3];return `<div class="row"><span>${m?'🧬 ':c[1]+' '}${m?c[8]:c[0]}<br><small>${p}🌿/cái</small></span><span><b>${n}</b> <input class="qty" id="sp_${k}" value="1" type="number"><button class="primary" onclick="sellProd('${id}',${m},${p})">Bán</button></span></div>`}function sellProd(id,m,p){let k=m?'m_'+id:id,q=qty('#sp_'+k,S.inv.prod[k]);confirmBox('Bán nông sản',`Bán ${q} nhận ${q*p}🌿?`,`doSellProd('${k}',${q},${p})`)}function doSellProd(k,q,p){S.inv.prod[k]-=q;S.coin+=q*p;save();openModal('inv');render()}function rowMat(k,n,p){let q=S.inv[k]||0;return q?`<div class="row"><span>${n}<br><small>Thu hồi ${p}🌿</small></span><span><b>${q}</b> <input class="qty" id="sm_${k}" value="1" type="number"><button class="primary" onclick="sellMat('${k}',${p})">Bán</button></span></div>`:''}function sellMat(k,p){let q=qty('#sm_'+k,S.inv[k]);confirmBox('Bán vật tư',`Bán ${q} nhận ${q*p}🌿?`,`doSellMat('${k}',${q},${p})`)}function doSellMat(k,q,p){S.inv[k]-=q;S.coin+=q*p;save();openModal('inv');render()}function doneOrder(i){let o=S.orders[i];if(!Object.entries(o.need).every(([id,n])=>(S.inv.prod[id]||0)>=n))return;for(let[id,n]of Object.entries(o.need))S.inv.prod[id]-=n;S.coin+=o.reward;S.orders[i]=order();save();openModal('orders');render()}function claim(i){let q=Q[i];if(S.claimed[i]||(S.stats[q[1]]||0)<q[2])return;S.claimed[i]=1;S.coin+=q[3];save();openModal('quests');render()}function weatherDetail(){confirmBox('Dự báo thời tiết',`Hiện tại: ${weatherIcon(S.weather)} ${W[S.weather][0]}<br>Tiếp theo: ${weatherIcon(S.forecast[0],WT)} ${W[S.forecast[0]][0]}`,'closeModal()')}function fmt(ms){let s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function addSeeds(){for(let k in S.inv.seeds)S.inv.seeds[k]+=5;render()}$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};try{render();setInterval(()=>{try{render()}catch(e){console.error(e)}},1000)}catch(e){console.error(e);document.body.innerHTML='<div style="padding:24px;color:#503921;font-family:system-ui"><h2>Không thể khởi tạo nông trại</h2><p>'+String(e.message||e)+'</p><button onclick="localStorage.removeItem(\'farmCloudV085\');location.reload()">Khởi tạo lại dữ liệu mới</button></div>'}
</script></body></html>
