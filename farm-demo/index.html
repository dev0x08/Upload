.modal{position:fixed;z-index:60;inset:0;background:#102c3388;display:none;place-items:center;padding:14px}.modal.open{display:grid}.panel{width:min(720px,96vw);max-height:88vh;overflow:auto;background:#fff4d8;color:#503921;border-radius:24px;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-16px;background:#fff4d8;padding:6px 0 10px}.close,.primary{border:0;border-radius:10px;background:#69a742;color:#fff;padding:8px 10px;font-weight:900}.close{width:36px;height:36px;border-radius:50%;background:#674832}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fffaf0;border:1px solid #ead8b7;border-radius:13px;padding:10px;margin:7px 0}.help,.item{background:#fffaf0;border-radius:12px;padding:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{text-align:center;border:1px solid #ead8b7}.tiny{font-size:10px;color:#80684c}.badge{display:inline-block;border-radius:99px;padding:2px 7px;font-size:9px;font-weight:900}.badge.normal{background:#e8dfc5}.badge.rare{background:#cdefff;color:#22627e}.badge.mutant{background:#edd6ff;color:#703a98}.toast{position:fixed;z-index:90;top:92px;left:50%;transform:translateX(-50%);background:#18372fee;padding:9px 14px;border-radius:99px;opacity:0;transition:.2s}.toast.show{opacity:1}

<script>
const C={
 corn:{name:'Bắp',icon:'🌽',buy:6,sell:15,grow:55,xp:8,level:1,rarity:'normal',mut:'Bắp tím đột biến',mutIcon:'🌽',mutSell:70,mutChance:.05},
 carrot:{name:'Cà rốt',icon:'🥕',buy:9,sell:22,grow:65,xp:11,level:1,rarity:'normal',mut:'Cà rốt trắng đột biến',mutIcon:'🥕',mutSell:95,mutChance:.05},
 wheat:{name:'Lúa mì',icon:'🌾',buy:12,sell:30,grow:78,xp:14,level:2,rarity:'normal',mut:'Lúa ánh kim đột biến',mutIcon:'🌾',mutSell:130,mutChance:.045},
 tomato:{name:'Cà chua',icon:'🍅',buy:16,sell:39,grow:92,xp:18,level:3,rarity:'normal',mut:'Cà chua vàng đột biến',mutIcon:'🍅',mutSell:165,mutChance:.045},
 strawberry:{name:'Dâu tây',icon:'🍓',buy:24,sell:58,grow:110,xp:25,level:4,rarity:'normal',mut:'Dâu trắng đột biến',mutIcon:'🍓',mutSell:240,mutChance:.04},
 pumpkin:{name:'Bí ngô',icon:'🎃',buy:34,sell:82,grow:135,xp:34,level:5,rarity:'normal',mut:'Bí khổng lồ đột biến',mutIcon:'🎃',mutSell:330,mutChance:.035},
 purplecarrot:{name:'Cà rốt tím',icon:'🥕',buy:42,sell:105,grow:105,xp:28,level:3,rarity:'rare',mut:'Cà rốt pha lê',mutIcon:'🥕',mutSell:420,mutChance:.025},
 goldstrawberry:{name:'Dâu vàng',icon:'🍓',buy:78,sell:190,grow:150,xp:45,level:5,rarity:'rare',mut:'Dâu cầu vồng',mutIcon:'🍓',mutSell:760,mutChance:.02},
 jadecorn:{name:'Bắp ngọc',icon:'🌽',buy:58,sell:145,grow:125,xp:36,level:4,rarity:'rare',mut:'Bắp thiên thạch',mutIcon:'🌽',mutSell:580,mutChance:.022}
};
const W={sunny:{name:'Nắng',icon:'☀️',speed:1.08,risk:1},cloudy:{name:'Nhiều mây',icon:'☁️',speed:1,risk:.9},rain:{name:'Mưa',icon:'🌧️',speed:.94,risk:1.15},hot:{name:'Nắng nóng',icon:'🌤️',speed:.84,risk:1.35}};
const Q=[['Thu hoạch 3 cây','harvest',3,60],['Trồng 10 cây','plant',10,90],['Tưới 8 lần','water',8,75],['Bón phân 5 lần','fert',5,90],['Xử lý sâu bệnh 3 lần','spray',3,120],['Tìm 1 cây đột biến','mutant',1,250]];
const O=[['Quán ăn trong làng',{corn:3,carrot:2},120],['Chợ buổi sáng',{wheat:4,carrot:2},165],['Nhà hàng ven sông',{tomato:3,corn:3},210],['Lễ hội làng',{strawberry:2,pumpkin:1},290]];
const D=[40,55,70,90,120,160,250],K='farmCloudV060',WT=90000;
const empty=u=>({unlocked:u,crop:null,plantedAt:0,wateredStages:[],fertilized:false,problem:null,checkedStages:[],mutationChecked:false,mutated:false});
const clone=x=>JSON.parse(JSON.stringify(x)),$=q=>document.querySelector(q);
function randomWeather(exclude){let a=Object.keys(W).filter(x=>x!==exclude);return a[Math.floor(Math.random()*a.length)]}
let seedBase={};for(const id in C)seedBase[id]=0;Object.assign(seedBase,{corn:8,carrot:5,wheat:2});
let prodBase={};for(const id in C){prodBase[id]=0;prodBase['mut_'+id]=0}
let def={coin:220,lv:1,xp:0,energy:20,maxEnergy:20,lastEnergy:Date.now(),selected:'corn',weather:'sunny',forecast:['cloudy','rain'],weatherChangedAt:Date.now(),inventory:{seeds:seedBase,produce:prodBase,fertilizer:3,pesticide:2},stats:{plant:0,harvest:0,water:0,fert:0,spray:0,mutant:0},plots:Array.from({length:20},(_,i)=>empty(i<12)),orders:O.slice(0,3).map((x,i)=>({id:i,name:x[0],need:x[1],reward:x[2]})),claimed:{},daily:{day:1,last:null}};
function compactPlots(list){let arr=(Array.isArray(list)?list:[]).slice(0,20).map(p=>({...empty(false),...(p||{}),wateredStages:Array.isArray(p?.wateredStages)?p.wateredStages:(p?.watered?[0]:[]),checkedStages:Array.isArray(p?.checkedStages)?p.checkedStages:[]}));while(arr.length<20)arr.push(empty(false));let open=arr.filter(p=>p.unlocked),locked=arr.filter(p=>!p.unlocked),out=open.concat(locked),count=open.length||12;return out.map((p,i)=>({...p,unlocked:i<count}))}
function load(){let old=null;for(const k of [K,'farmCloudV051','farmCloudV050','farmCloudV044','farmCloudV043','farmCloudV042'])try{let v=localStorage.getItem(k);if(v){old=JSON.parse(v);break}}catch{}let s=clone(def);if(old){Object.assign(s,old);s.inventory={...def.inventory,...(old.inventory||{})};s.inventory.seeds={...def.inventory.seeds,...(old.inventory?.seeds||{})};s.inventory.produce={...def.inventory.produce,...(old.inventory?.produce||{})};s.stats={...def.stats,...(old.stats||{})}}s.weather=W[s.weather]?s.weather:'sunny';if(!Array.isArray(s.forecast))s.forecast=[];s.forecast=s.forecast.filter(x=>W[x]).slice(0,2);while(s.forecast.length<2)s.forecast.push(randomWeather(s.forecast.at(-1)||s.weather));s.plots=compactPlots(s.plots);if(!Array.isArray(s.orders)||!s.orders.length)s.orders=clone(def.orders);s.claimed=s.claimed||{};s.daily=s.daily||{day:1,last:null};return s}
let S=load();
function save(){localStorage.setItem(K,JSON.stringify(S))}
function msg(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove('show'),1400)}
function xpNeed(){return 100+(S.lv-1)*35}
function addXP(n){S.xp+=n;while(S.xp>=xpNeed()){S.xp-=xpNeed();S.lv++;S.maxEnergy=Math.min(40,S.maxEnergy+1);S.energy=S.maxEnergy;msg('🎉 Lên cấp '+S.lv)}}
function regen(){let n=Math.floor((Date.now()-Number(S.lastEnergy||Date.now()))/60000);if(n>0){S.energy=Math.min(S.maxEnergy,S.energy+n);S.lastEnergy+=n*60000;save()}}
function spend(){regen();if(S.energy<1){msg('⚡ Không đủ năng lượng');return false}S.energy--;save();return true}
function si(q){return q<.16?0:q<.4?1:q<.72?2:q<1?3:4}
function stage(q){return [['Gieo hạt','🟤'],['Mầm','🌱'],['Cây non','🌿'],['Trưởng thành','🌳'],['Thu hoạch',null]][si(q)]}
function prog(p){if(!p.crop||!C[p.crop])return 0;let c=C[p.crop],sp=W[S.weather].speed*(1+Math.min(3,p.wateredStages.length)*.07)*(p.fertilized?1.15:1)*(p.problem?.55:1);return Math.min(1,(Date.now()-p.plantedAt)/(c.grow*1000/sp))}
function maybeMutate(p,q){if(!p.crop||p.mutationChecked||q<.72)return;p.mutationChecked=true;let c=C[p.crop],chance=c.mutChance*(p.fertilized?1.15:1)*(S.weather==='hot'?1.08:1);if(Math.random()<chance){p.mutated=true;S.stats.mutant++;msg('🧬 Đột biến! '+c.mut)}save()}
function risk(p,q){let st=si(q);if(!p.crop||st<1||st>3||p.checkedStages.includes(st))return;p.checkedStages.push(st);if(Math.random()<.08*W[S.weather].risk*(st===3?1.25:1)){p.problem=Math.random()<.65?'pest':'disease';msg(p.problem==='pest'?'🐛 Cây bị sâu!':'🦠 Cây bị bệnh!')}save()}
const uc=i=>60+Math.max(0,i-12)*25,firstLocked=()=>S.plots.findIndex(p=>!p.unlocked),firstEmpty=()=>S.plots.findIndex(p=>p.unlocked&&!p.crop);
function plotClick(i){let p=S.plots[i];if(!p.unlocked){let next=firstLocked();if(i!==next)return msg('🔒 Hãy mở ô trước theo thứ tự');let cost=uc(i);if(S.coin<cost)return msg('Không đủ tiền');S.coin-=cost;p.unlocked=true;save();render();return}if(!p.crop){let next=firstEmpty();if(i!==next)return msg('🌱 Hãy trồng ô trước theo thứ tự');let c=C[S.selected];if(!c||S.lv<c.level||(S.inventory.seeds[S.selected]||0)<1)return msg('Không có hạt phù hợp');if(!spend())return;S.inventory.seeds[S.selected]--;Object.assign(p,empty(true),{crop:S.selected,plantedAt:Date.now()});S.stats.plant++;save();render();return}let q=prog(p);maybeMutate(p,q);risk(p,q);if(q>=1&&!p.problem)return harvest(i);care(i)}
function water(i){let p=S.plots[i],st=si(prog(p));if(st>=4||p.wateredStages.includes(st)||!spend())return;p.wateredStages.push(st);S.stats.water++;save();care(i);render()}
function fert(i){let p=S.plots[i];if(p.fertilized)return;if(si(prog(p))<1)return msg('Chờ cây lên mầm');if(S.inventory.fertilizer<1)return msg('Hết phân');if(!spend())return;S.inventory.fertilizer--;p.fertilized=true;S.stats.fert++;save();care(i);render()}
function spray(i){let p=S.plots[i];if(!p.problem)return;if(S.inventory.pesticide<1)return msg('Hết thuốc');if(!spend())return;S.inventory.pesticide--;p.problem=null;S.stats.spray++;save();care(i);render()}
function harvest(i){let p=S.plots[i];if(!p.crop||prog(p)<1||p.problem||!spend())return;let id=p.crop,c=C[id],key=p.mutated?'mut_'+id:id;S.inventory.produce[key]=(S.inventory.produce[key]||0)+1;S.stats.harvest++;addXP(c.xp+(p.mutated?c.xp:0));let label=p.mutated?c.mut:c.name;Object.assign(p,empty(true));save();render();msg('✅ Thu hoạch '+label)}
function care(i){let p=S.plots[i],q=prog(p),st=si(q),c=C[p.crop],sg=stage(q);maybeMutate(p,q);$('#modal').classList.add('open');$('#mt').textContent=(p.mutated?'🧬 '+c.mut:c.name)+' • '+sg[0];$('#mb').innerHTML=`<div class="help">${rarityBadge(p.mutated?'mutant':c.rarity)}<br>Tiến độ <b>${Math.floor(q*100)}%</b>${p.problem?'<br>'+(p.problem==='pest'?'🐛 Sâu':'🦠 Bệnh'):''}</div><div class="row"><span>💧 Tưới giai đoạn này</span><button class="primary" onclick="water(${i})" ${st>=4||p.wateredStages.includes(st)?'disabled':''}>${p.wateredStages.includes(st)?'Đã tưới':'Tưới'}</button></div><div class="row"><span>✨ Bón phân (${S.inventory.fertilizer})</span><button class="primary" onclick="fert(${i})" ${p.fertilized?'disabled':''}>${p.fertilized?'Đã bón':'Bón'}</button></div><div class="row"><span>🧴 Thuốc (${S.inventory.pesticide})</span><button class="primary" onclick="spray(${i})" ${!p.problem?'disabled':''}>Phun</button></div>`}
function rarityBadge(r){return r==='rare'?'<span class="badge rare">HIẾM</span>':r==='mutant'?'<span class="badge mutant">ĐỘT BIẾN</span>':'<span class="badge normal">THƯỜNG</span>'}
function renderPlots(){for(let p of S.plots)if(p.crop){let q=prog(p);maybeMutate(p,q);risk(p,q)}let fl=firstLocked(),fe=firstEmpty();$('#plots').innerHTML=S.plots.map((p,i)=>{if(!p.unlocked)return `<button class="plot locked ${i===fl?'next':'waiting'}" onclick="plotClick(${i})"><span class="tag">${i===fl?'🔓 '+uc(i)+' 🌿':'🔒'}</span></button>`;if(!p.crop)return `<button class="plot ${i===fe?'next':'waiting'}" onclick="plotClick(${i})">${i===fe?'<span class="tag">🌱 Ô tiếp theo</span>':''}</button>`;let q=prog(p),c=C[p.crop],sg=stage(q),ready=q>=1&&!p.problem,st=si(q),ico=q>=1?c.icon:sg[1],cls=p.mutated?'mutant':c.rarity==='rare'?'rare':'';return `<button class="plot ${cls} ${ready?'ready':''}" onclick="plotClick(${i})"><span class="tag">${ready?'THU HOẠCH':p.problem&&q>=1?'CẦN XỬ LÝ':Math.floor(q*100)+'%'}</span><span class="care">${p.wateredStages.includes(st)?'💧':''}${p.fertilized?'✨':''}</span><span class="problem">${p.problem?(p.problem==='pest'?'🐛':'🦠'):''}</span><span class="crop">${p.mutated?'🧬':ico}</span><span class="stage">${q>=1?(p.mutated?'Đột biến':'Thu hoạch'):sg[0]}</span><span class="rarity">${p.mutated?'🧬':c.rarity==='rare'?'💎':''}</span><span class="grow"><i style="width:${q*100}%"></i></span></button>`}).join('')}
function clockInfo(offsetMs=0){let d=new Date(Date.now()+offsetMs),h=d.getHours(),m=d.getMinutes();return{h,text:String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'),night:h<6||h>=18}}
function phase(){let h=clockInfo().h;return h>=5&&h<7?'dawn':h>=7&&h<17?'day':h>=17&&h<19?'dusk':'night'}
function weatherIcon(type,offset=0){let ci=clockInfo(offset),w=W[type]||W.sunny;if(!ci.night)return w.icon;if(type==='rain')return'🌧️';if(type==='cloudy')return'☁️';return'🌙'}
function weatherName(type,offset=0){let ci=clockInfo(offset),w=W[type]||W.sunny;if(!ci.night)return w.name;if(type==='rain')return'Mưa đêm';if(type==='cloudy')return'Đêm nhiều mây';return'Đêm quang'}
function timeWeather(){document.body.className=phase();$('#clock').textContent=clockInfo().text;let i0=weatherIcon(S.weather),i1=weatherIcon(S.forecast[0],WT),i2=weatherIcon(S.forecast[1],WT*2);$('#weather').innerHTML=`${i0}<span class="forecastArrow">→</span>${i1}<span class="forecastArrow">→</span>${i2}`}
function weatherDetail(){$('#modal').classList.add('open');$('#mt').textContent='Dự báo thời tiết';$('#mb').innerHTML=`<div class="row"><span>Hiện tại</span><b>${weatherIcon(S.weather)} ${weatherName(S.weather)}</b></div><div class="row"><span>Tiếp theo</span><b>${weatherIcon(S.forecast[0],WT)} ${weatherName(S.forecast[0],WT)}</b></div><div class="row"><span>Sau đó</span><b>${weatherIcon(S.forecast[1],WT*2)} ${weatherName(S.forecast[1],WT*2)}</b></div>`}
function rollWeather(){S.weather=S.forecast.shift();S.forecast.push(randomWeather(S.forecast.at(-1)||S.weather));S.weatherChangedAt=Date.now();save()}
function maybeWeather(){let elapsed=Date.now()-Number(S.weatherChangedAt||0);if(elapsed<WT)return;let steps=Math.min(6,Math.floor(elapsed/WT));while(steps-->0)rollWeather()}
function render(){regen();maybeWeather();$('#coin').textContent=S.coin;$('#lv').textContent=S.lv;$('#xp').style.width=Math.min(100,S.xp/xpNeed()*100)+'%';$('#energyTxt').textContent=S.energy+'/'+S.maxEnergy;$('#energy').style.width=S.energy/S.maxEnergy*100+'%';timeWeather();let seeds=Object.entries(C).filter(([id,c])=>S.lv>=c.level&&(S.inventory.seeds[id]||0)>0);if(!seeds.some(([id])=>id===S.selected)&&seeds.length)S.selected=seeds[0][0];$('#tray').innerHTML=seeds.map(([id,c])=>`<button class="seed ${c.rarity==='rare'?'rare':''} ${S.selected===id?'active':''}" onclick="S.selected='${id}';save();render()">${c.icon}<b>${S.inventory.seeds[id]}</b></button>`).join('');let qi=Q.findIndex((q,i)=>!S.claimed[i]);if(qi<0)qi=Q.length-1;let q=Q[qi];$('#mission').textContent=q[0]+' ('+Math.min(S.stats[q[1]]||0,q[2])+'/'+q[2]+')';renderPlots()}
function toggleNav(){let t=$('#toolbar');t.classList.toggle('collapsed');$('#navToggle').textContent=t.classList.contains('collapsed')?'☰':'✕'}
function total(id){return Number(S.inventory.produce[id]||0)}
function openModal(type){$('#modal').classList.add('open');let t=$('#mt'),b=$('#mb');
if(type==='shop'){t.textContent='Cửa hàng hạt giống';let normal=Object.entries(C).filter(([,c])=>c.rarity==='normal'),rare=Object.entries(C).filter(([,c])=>c.rarity==='rare');let cards=a=>a.map(([id,c])=>`<div class="item"><b>${c.icon} ${c.name}</b><br>${rarityBadge(c.rarity)}<p class="tiny">LV ${c.level} • ${c.grow}s • bán ${c.sell}🌿</p><button class="primary" onclick="buySeed('${id}')" ${S.lv<c.level?'disabled':''}>Mua 5 • ${c.buy*5}🌿</button></div>`).join('');b.innerHTML=`<h3>🌱 Giống thường</h3><div class="grid">${cards(normal)}</div><h3>💎 Giống hiếm</h3><div class="grid">${cards(rare)}</div><div class="grid" style="margin-top:10px"><div class="item">✨ Phân bón<br><button class="primary" onclick="buyItem('fertilizer',3,45)">Mua 3 • 45</button></div><div class="item">🧴 Thuốc<br><button class="primary" onclick="buyItem('pesticide',3,60)">Mua 3 • 60</button></div></div>`}
else if(type==='inventory'){t.textContent='Kho';let seedRows=Object.entries(C).filter(([id])=>S.inventory.seeds[id]>0).map(([id,c])=>`<div class="row"><span>${c.icon} ${c.name} ${rarityBadge(c.rarity)}</span><b>${S.inventory.seeds[id]}</b></div>`).join('');let prod=[];for(const[id,c]of Object.entries(C)){if(total(id)>0)prod.push(`<div class="row"><span>${c.icon} ${c.name}</span><span><b>${total(id)}</b> <button class="primary" onclick="sell('${id}',false)">Bán ${c.sell}🌿</button></span></div>`);if(total('mut_'+id)>0)prod.push(`<div class="row"><span>🧬 ${c.mut} ${rarityBadge('mutant')}</span><span><b>${total('mut_'+id)}</b> <button class="primary" onclick="sell('${id}',true)">Bán ${c.mutSell}🌿</button></span></div>`)}let su=(S.inventory.fertilizer?`<div class="row">✨ Phân bón <b>${S.inventory.fertilizer}</b></div>`:'')+(S.inventory.pesticide?`<div class="row">🧴 Thuốc <b>${S.inventory.pesticide}</b></div>`:'');b.innerHTML=`<h3>🌰 Hạt giống</h3>${seedRows||'<div class="help">Không có hạt giống.</div>'}<h3>🧺 Cây đã thu hoạch</h3>${prod.join('')||'<div class="help">Chưa có nông sản.</div>'}${su?'<h3>🧰 Vật tư</h3>'+su:''}`}
else if(type==='orders'){t.textContent='Đơn hàng';b.innerHTML=S.orders.map((o,i)=>`<div class="row"><div><b>${o.name}</b><div class="tiny">${Object.entries(o.need).map(([id,n])=>C[id].icon+' '+n+' (có '+total(id)+')').join(' • ')}</div></div><button class="primary" onclick="completeOrder(${i})" ${Object.entries(o.need).every(([id,n])=>total(id)>=n)?'':'disabled'}>Giao<br>${o.reward}🌿</button></div>`).join('')}
else if(type==='quests'){t.textContent='Nhiệm vụ';b.innerHTML=Q.map((q,i)=>{let cur=S.stats[q[1]]||0,cl=S.claimed[i];return `<div class="row"><div><b>${cl?'✅ ':''}${q[0]}</b><div class="tiny">${Math.min(cur,q[2])}/${q[2]} • ${q[3]}🌿</div></div><button class="primary" onclick="claimQ(${i})" ${cur<q[2]||cl?'disabled':''}>${cl?'Đã nhận':'Nhận'}</button></div>`}).join('')}
else if(type==='daily'){t.textContent='Quà hằng ngày';let today=new Date().toDateString(),cl=S.daily.last===today;b.innerHTML='<div class="grid">'+D.map((r,i)=>`<div class="item">Ngày ${i+1}<br>🎁 ${r}🌿</div>`).join('')+`</div><p><button class="primary" onclick="claimDaily()" ${cl?'disabled':''}>${cl?'Đã nhận':'Nhận ngày '+S.daily.day}</button></p>`}
else{t.textContent='Test';b.innerHTML='<div class="grid"><button class="primary" onclick="S.coin+=500;save();render()">+500🌿</button><button class="primary" onclick="S.energy=S.maxEnergy;save();render()">Đầy ⚡</button><button class="primary" onclick="advance()">+1 giai đoạn</button><button class="primary" onclick="nextW()">Đổi thời tiết</button><button class="primary" onclick="forceP()">Tạo sâu/bệnh</button><button class="primary" onclick="addSeeds()">+5 tất cả hạt</button><button class="primary" onclick="forceMutation()">Tạo đột biến</button><button class="primary" onclick="resetSave()">Reset save</button></div><p class="help">v0.6.0 • Cây Thường / Hiếm / Đột biến. Đột biến phát sinh trong lúc trồng, không bán hạt đột biến trực tiếp.</p>'}}
function closeModal(){$('#modal').classList.remove('open')}
function buySeed(id){let c=C[id],cost=c.buy*5;if(S.lv<c.level)return msg('Cần LV '+c.level);if(S.coin<cost)return msg('Không đủ tiền');S.coin-=cost;S.inventory.seeds[id]=(S.inventory.seeds[id]||0)+5;save();openModal('shop');render()}
function buyItem(k,n,cost){if(S.coin<cost)return msg('Không đủ tiền');S.coin-=cost;S.inventory[k]=(S.inventory[k]||0)+n;save();openModal('shop');render()}
function sell(id,mut){let key=mut?'mut_'+id:id;if(total(key)<1)return;S.inventory.produce[key]--;S.coin+=mut?C[id].mutSell:C[id].sell;save();openModal('inventory');render()}
function completeOrder(i){let o=S.orders[i];if(!Object.entries(o.need).every(([id,n])=>total(id)>=n))return;for(let[id,n]of Object.entries(o.need))S.inventory.produce[id]-=n;S.coin+=o.reward;addXP(Math.round(o.reward/8));let x=O[(Date.now()+i)%O.length];S.orders[i]={id:Date.now()+i,name:x[0],need:clone(x[1]),reward:x[2]};save();openModal('orders');render()}
function claimQ(i){let q=Q[i];if(S.claimed[i]||(S.stats[q[1]]||0)<q[2])return;S.claimed[i]=true;S.coin+=q[3];addXP(Math.round(q[3]/4));save();openModal('quests');render()}
function claimDaily(){let t=new Date().toDateString();if(S.daily.last===t)return;let r=D[Math.min(S.daily.day-1,6)];S.coin+=r;S.daily.last=t;S.daily.day=S.daily.day>=7?1:S.daily.day+1;save();openModal('daily');render()}
function advance(){for(let p of S.plots)if(p.crop)p.plantedAt-=C[p.crop].grow*1000*.26;save();render()}
function nextW(){rollWeather();render()}
function forceP(){let p=S.plots.find(x=>x.crop);if(!p)return msg('Hãy trồng cây trước');p.problem=Math.random()<.5?'pest':'disease';save();render()}
function forceMutation(){let p=S.plots.find(x=>x.crop);if(!p)return msg('Hãy trồng cây trước');if(!p.mutated){p.mutated=true;p.mutationChecked=true;S.stats.mutant++;save();render();msg('🧬 Đã tạo đột biến để test')}}
function addSeeds(){for(let k in S.inventory.seeds)S.inventory.seeds[k]+=5;save();render()}
function resetSave(){for(let k of Object.keys(localStorage))if(k.startsWith('farmCloudV'))localStorage.removeItem(k);location.reload()}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
render();setInterval(()=>{maybeWeather();timeWeather();renderPlots();regen();$('#energyTxt').textContent=S.energy+'/'+S.maxEnergy;$('#energy').style.width=S.energy/S.maxEnergy*100+'%'},1000);
</script></body></html>
