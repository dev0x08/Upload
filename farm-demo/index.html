<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Nông Trại Mây v0.8.2</title><style>html,body{margin:0;height:100%;font-family:system-ui;background:#c9eef6}.load{height:100%;display:grid;place-items:center;color:#24483f}.box{text-align:center}.spin{font-size:42px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{border:0;border-radius:12px;padding:10px 16px;background:#69a742;color:#fff;font-weight:800}</style></head><body><div class="load"><div class="box"><div class="spin">🌱</div><b>Đang vào nông trại...</b><p id="e"></p></div></div><script>(async()=>{try{let base='https://raw.githubusercontent.com/dev0x08/Upload/main/farm-demo/';let u=['v082-part1.txt','v082-part2.txt','v082-part3.txt','v082-part4.txt'];let a=await Promise.all(u.map(x=>fetch(base+x+'?v=082').then(r=>{if(!r.ok)throw Error(r.status);return r.text()})));document.open();document.write(a.join(''));document.close()}catch(err){document.getElementById('e').innerHTML='Không tải được dữ liệu game.<br><button onclick="location.reload()">Thử lại</button>';console.error(err)}})()</script></body></html>
