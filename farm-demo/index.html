teredStages.includes(st)?'disabled':''}>${p.wateredStages.includes(st)?'Đã tưới':'Tưới'}</button></div><div class="row"><span>✨ Phân (${S.inventory.fertilizer})</span><button class="primary" onclick="fert(${i})" ${p.fertilized?'disabled':''}>Bón</button></div><div class="row"><span>🧴 Thuốc (${S.inventory.pesticide})</span><button class="primary" onclick="spray(${i})" ${!p.problem?'disabled':''}>Phun</button></div><button class="danger" style="width:100%" onclick="askCut(${i})">🪓 Chặt bỏ cây</button>`}function rarityBadge(r){return r==='rare'?'<span class="badge rare">HIẾM</span>':r==='mutant'?'<span class="badge mutant">ĐỘT BIẾN</span>':'<span class="badge normal">THƯỜNG</span>'}function renderPlots(){for(let p of S.plots)if(p.crop){let q=prog(p);maybeMutate(p,q);risk(p,q)}let fl=firstLocked(),fe=firstEmpty();$('#plots').innerHTML=S.plots.map((p,i)=>{if(!p.unlocked)return `<button class="plot locked ${i===fl?'next':'waiting'}" onclick="plotClick(${i})"><span class="tag">${i===fl?'🔓 '+uc(i)+' 🌿':'🔒'}</span></button>`;if(!p.crop)return `<button class="plot ${i===fe?'next':'waiting'}" onclick="plotClick(${i})"></button>`;let q=rawProg(p),c=C[p.crop],st=si(q),sg=stage(q),ready=q>=1&&!p.problem,need=st<4&&!p.wateredStages.includes(st),cls=p.mutated?'mutant':c.rarity==='rare'?'rare':'';return `<button class="plot ${cls} ${ready?'ready':''}" onclick="plotClick(${i})"><span class="tag">${ready?'THU HOẠCH':need?'💧 CẦN TƯỚI':Math.floor(q*100)+'%'}</span><span class="care">${p.fertilized?'✨':''}</span><span class="problem">${p.problem?(p.problem==='pest'?'🐛':'🦠'):''}</span><span class="crop">${p.mutated?'🧬':q>=1?c.icon:sg[1]}</span><span class="stage">${q>=1?'Thu hoạch':sg[0]}</span><span class="rarity">${p.mutated?'🧬':c.rarity==='rare'?'💎':''}</span><span class="grow"><i style="width:${q*100}%"></i></span></button>`}).join('')}function clockInfo(offset=0){let d=new Date(Date.now()+offset),h=d.getHours(),m=d.getMinutes();return{h,text:String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'),night:h<6||h>=18}}function phase(){let h=clockInfo().h;return h>=5&&h<7?'dawn':h>=7&&h<17?'day':h>=17&&h<19?'dusk':'night'}function weatherIcon(type,offset=0){let ci=clockInfo(offset),w=W[type]||W.sunny;if(!ci.night)return w.icon;if(type==='rain')return'🌧️';if(type==='cloudy')return'☁️';return'🌙'}function timeWeather(){document.body.className=phase();$('#clock').textContent=clockInfo().text;$('#weather').innerHTML=`${weatherIcon(S.weather)}<span class="forecastArrow">→</span>${weatherIcon(S.forecast[0],WT)}`}function weatherDetail(){$('#modal').classList.add('open');$('#mt').textContent='Dự báo thời tiết';$('#mb').innerHTML=`<div class="row"><span>Hiện tại</span><b>${weatherIcon(S.weather)} ${W[S.weather].name}</b></div><div class="row"><span>Tiếp theo</span><b>${weatherIcon(S.forecast[0],WT)} ${W[S.forecast[0]].name}</b></div>`}function rollWeather(){S.weather=S.forecast.shift();S.forecast.push(randomWeather(S.forecast.at(-1)||S.weather));S.weatherChangedAt=Date.now();save()}function maybeWeather(){if(Date.now()-Number(S.weatherChangedAt||0)>=WT)rollWeather()}function maybeRareShop(){if(Date.now()-Number(S.rareShop?.changedAt||0)>=SHOP_MS){S.rareShop=newRareShop();save()}}function fmt(ms){let s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function refreshOrders(){let changed=false;S.orders=S.orders.map(o=>{if(Date.now()>=Number(o.expiresAt||0)){changed=true;return makeOrder()}return o});if(changed)save()}function render(){regen();maybeWeather();maybeRareShop();refreshOrders();$('#coin').textContent=S.coin;$('#lv').textContent=S.lv;$('#xp').style.width=Math.min(100,S.xp/xpNeed()*100)+'%';$('#energyTxt').textContent=S.energy+'/'+S.maxEnergy;$('#energy').style.width=S.energy/S.maxEnergy*100+'%';timeWeather();let seeds=Object.entries(C).filter(([id,c])=>S.lv>=c.level&&(S.inventory.seeds[id]||0)>0);if(!seeds.some(([id])=>id===S.selected)&&seeds.length)S.selected=seeds[0][0];$('#tray').innerHTML=seeds.map(([id,c])=>`<button class="seed ${c.rarity==='rare'?'rare':''} ${S.selected===id?'active':''}" onclick="S.selected='${id}';save();render()">${c.icon}<b>${S.inventory.seeds[id]}</b></button>`).join('');renderPlots()}function toggleNav(){let t=$('#toolbar');t.classList.toggle('collapsed');$('#navToggle').textContent=t.classList.contains('collapsed')?'☰':'✕'}function total(id){return Number(S.inventory.produce[id]||0)}function cropCard(id,c,rare=false){let stock=rare?Number(S.rareShop.stock[id]||0):999;return `<div class="item"><b>${c.icon} ${c.name}</b><br>${rarityBadge(c.rarity)}<p class="tiny">LV ${c.level} • bán ${c.sell}🌿${rare?' • còn '+stock:''}</p><input class="qty" id="buy_${id}" type="number" min="1" max="${stock}" value="1"><br><button class="primary" style="margin-top:7px" onclick="askBuy('${id}')" ${S.lv<c.level||stock<1?'disabled':''}>Mua</button></div>`}function materialCard(k,icon,name,price){return `<div class="item"><b>${icon} ${name}</b><p class="tiny">Đang có ${S.inventory[k]||0} • ${price}🌿/cái</p><input class="qty" id="mat_${k}" type="number" min="1" max="999" value="1"><br><button class="primary" style="margin-top:7px" onclick="askMaterial('${k}','${name}',${price})">Mua</button></div>`}function openModal(type){$('#modal').classList.add('open');let t=$('#mt'),b=$('#mb');if(type==='shop'){t.textContent='Cửa hàng';let normal=Object.entries(C).filter(([,c])=>c.rarity==='normal'),rare=S.rareShop.ids.map(id=>[id,C[id]]);b.innerHTML=`<h3 class="shopTitle">🌱 Hạt giống thường</h3><div class="grid">${normal.map(([id,c])=>cropCard(id,c)).join('')}</div><h3 class="shopTitle">💎 Hạt giống hiếm <span class="tiny">${fmt(SHOP_MS-(Date.now()-S.rareShop.changedAt))}</span></h3><div class="grid">${rare.map(([id,c])=>cropCard(id,c,true)).join('')}</div><h3 class="shopTitle">🧰 Vật tư chăm sóc</h3><div class="grid">${materialCard('fertilizer','✨','Phân bón',15)}${materialCard('pesticide','🧴','Thuốc sâu',20)}</div>`}else if(type==='inventory'){t.textContent='Kho';let seedRows=Object.entries(C).filter(([id])=>S.inventory.seeds[id]>0).map(([id,c])=>`<div class="row"><span>${c.icon} ${c.name}</span><b>${S.inventory.seeds[id]}</b></div>`).join(''),prod=[];for(const[id,c]of Object.entries(C)){if(total(id)>0)prod.push(`<div class="row"><span>${c.icon} ${c.name}<br><small>${c.sell}🌿/cái</small></span><span><b>${total(id)}</b> <input class="qty" id="sell_${id}_0" type="number" min="1" max="${total(id)}" value="1"> <button class="primary" onclick="askSell('${id}',false)">Bán</button></span></div>`);if(total('mut_'+id)>0)prod.push(`<div class="row"><span>🧬 ${c.mut}<br><small>${c.mutSell}🌿/cái</small></span><span><b>${total('mut_'+id)}</b> <input class="qty" id="sell_${id}_1" type="number" min="1" max="${total('mut_'+id)}" value="1"> <button class="primary" onclick="askSell('${id}',true)">Bán</button></span></div>`)}b.innerHTML=`<h3>🌰 Hạt giống</h3>${seedRows||'<div class="help">Không có hạt.</div>'}<h3>🧺 Nông sản</h3>${prod.join('')||'<div class="help">Chưa có nông sản.</div>'}<h3>🧰 Vật tư</h3><div class="row"><span>✨ Phân bón</span><b>${S.inventory.fertilizer}</b></div><div class="row"><span>🧴 Thuốc sâu</span><b>${S.inventory.pesticide}</b></div>`}else if(type==='orders'){refreshOrders();t.textContent='Đơn hàng';b.innerHTML=S.orders.map((o,i)=>`<div class="row"><div><b>${o.name}</b><div class="tiny">${Object.entries(o.need).map(([id,n])=>C[id].icon+' '+n+' (có '+total(id)+')').join(' • ')}</div><div class="orderTime">⏱ ${fmt(o.expiresAt-Date.now())}</div></div><button class="primary" onclick="completeOrder(${i})" ${Object.entries(o.need).every(([id,n])=>total(id)>=n)?'':'disabled'}>Giao<br>${o.reward}🌿</button></div>`).join('')+'<div class="help">Hết giờ, đơn sẽ tự đổi sang đơn ngẫu nhiên mới.</div>'}else if(type==='quests'){t.textContent='Nhiệm vụ';b.innerHTML=Q.map((q,i)=>{let cur=S.stats[q[1]]||0,cl=S.claimed[i];return `<div class="row"><div><b>${cl?'✅ ':''}${q[0]}</b><div class="tiny">${Math.min(cur,q[2])}/${q[2]} • ${q[3]}🌿</div></div><button class="primary" onclick="claimQ(${i})" ${cur<q[2]||cl?'disabled':''}>${cl?'Đã nhận':'Nhận'}</button></div>`}).join('')}else{t.textContent='Test';b.innerHTML='<div class="grid"><button class="primary" onclick="S.coin+=500;save();render()">+500🌿</button><button class="primary" onclick="S.energy=S.maxEnergy;save();render()">Đầy ⚡</button><button class="primary" onclick="advance()">+1 giai đoạn</button><button class="primary" onclick="nextW()">Đổi thời tiết</button><button class="primary" onclick="forceP()">Tạo sâu/bệnh</button><button class="primary" onclick="addSeeds()">+5 hạt</button><button class="primary" onclick="forceMutation()">Tạo đột biến</button><button class="primary" onclick="S.orders=[makeOrder(),makeOrder(),makeOrder()];save();openModal(\'orders\')">Đổi đơn</button><button class="primary" onclick="resetSave()">Reset save</button></div><p class="help">v0.7.1 • bỏ quà ngày, đơn ngẫu nhiên có thời gian, vật tư tách riêng, bán theo số lượng.</p>'}}function closeModal(){$('#modal').classList.remove('open')}function confirmBox(title,text,action){$('#modal').classList.add('open');$('#mt').textContent=title;$('#mb').innerHTML=`<div class="help">${text}</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="ghost" onclick="closeModal()">Hủy</button><button class="primary" onclick="${action}">Xác nhận</button></div>`}function askBuy(id){let c=C[id],max=c.rarity==='rare'?Number(S.rareShop.stock[id]||0):999,q=Math.max(1,Math.min(max,parseInt($('#buy_'+id)?.value||1)||1));if(max<1)return msg('Hết hàng');confirmBox('Xác nhận mua',`Mua <b>${q}</b> hạt ${c.name} với giá <b>${c.buy*q}🌿</b>?`,`buySeed('${id}',${q})`)}function buySeed(id,q){let c=C[id],cost=c.buy*q;if(S.coin<cost)return msg('Không đủ tiền');if(c.rarity==='rare'&&S.rareShop.stock[id]<q)return msg('Không đủ tồn kho');S.coin-=cost;S.inventory.seeds[id]=(S.inventory.seeds[id]||0)+q;if(c.rarity==='rare')S.rareShop.stock[id]-=q;save();openModal('shop');render()}function askMaterial(k,name,price){let q=Math.max(1,Math.min(999,parseInt($('#mat_'+k)?.value||1)||1));confirmBox('Xác nhận mua',`Mua <b>${q}</b> ${name} với giá <b>${q*price}🌿</b>?`,`buyMaterial('${k}',${q},${price})`)}function buyMaterial(k,q,price){if(S.coin<q*price)return msg('Không đủ tiền');S.coin-=q*price;S.inventory[k]=(S.inventory[k]||0)+q;save();openModal('shop');render()}function askSell(id,mut){let c=C[id],key=mut?'mut_'+id:id,max=total(key),q=Math.max(1,Math.min(max,parseInt($('#sell_'+id+'_'+(mut?1:0))?.value||1)||1)),price=mut?c.mutSell:c.sell;confirmBox('Xác nhận bán',`Bán <b>${q}</b> sản phẩm và nhận <b>${q*price}🌿</b>?`,`sell('${id}',${mut},${q})`)}function sell(id,mut,q){let key=mut?'mut_'+id:id;if(total(key)<q)return msg('Không đủ nông sản');S.inventory.produce[key]-=q;S.coin+=q*(mut?C[id].mutSell:C[id].sell);save();openModal('inventory');render()}function completeOrder(i){refreshOrders();let o=S.orders[i];if(!o||Date.now()>=o.expiresAt){S.orders[i]=makeOrder();save();return openModal('orders')}if(!Object.entries(o.need).every(([id,n])=>total(id)>=n))return;for(let[id,n]of Object.entries(o.need))S.inventory.produce[id]-=n;S.coin+=o.reward;addXP(Math.round(o.reward/8));S.orders[i]=makeOrder();save();openModal('orders');render()}function claimQ(i){let q=Q[i];if(S.claimed[i]||(S.stats[q[1]]||0)<q[2])return;S.claimed[i]=true;S.coin+=q[3];addXP(Math.round(q[3]/4));save();openModal('quests');render()}function advance(){for(let p of S.plots)if(p.crop){let st=si(rawProg(p));if(st<4&&!p.wateredStages.includes(st))p.wateredStages.push(st);p.growthMs=Math.min(C[p.crop].grow*1000,ENDS[Math.min(st,3)]*C[p.crop].grow*1000);p.lastTick=Date.now()}save();render()}function nextW(){rollWeather();render()}function forceP(){let p=S.plots.find(x=>x.crop);if(p){p.problem='pest';save();render()}}function forceMutation(){let p=S.plots.find(x=>x.crop);if(p&&!p.mutated){p.mutated=true;p.mutationChecked=true;S.stats.mutant++;save();render()}}function addSeeds(){for(let k in S.inventory.seeds)S.inventory.seeds[k]+=5;save();render()}function resetSave(){for(let k of Object.keys(localStorage))if(k.startsWith('farmCloudV'))localStorage.removeItem(k);location.reload()}$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();setInterval(()=>{maybeWeather();maybeRareShop();refreshOrders();timeWeather();renderPlots();regen();$('#energyTxt').textContent=S.energy+'/'+S.maxEnergy;$('#energy').style.width=S.energy/S.maxEnergy*100+'%'},1000);</script></body></html>
