<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(150deg,#b8efff,#fbe8ef);color:#fff;overflow:hidden}button{font:inherit}.game{height:100dvh;min-height:640px;position:relative}.card{background:#203f37ee;border:1px solid #ffffff32;backdrop-filter:blur(10px);border-radius:18px;box-shadow:0 10px 24px #244b4033}.top{position:absolute;z-index:20;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.profile{display:flex;align-items:center;gap:9px;padding:7px 10px}.avatar{width:46px;height:46px;border-radius:14px;background:#ffe59a;display:grid;place-items:center;font-size:27px;border:2px solid #fff}.name{font-weight:900}.xp{width:120px;height:8px;background:#10261f;border-radius:99px;overflow:hidden}.xp i{display:block;height:100%;background:#ffd45c}.money{padding:11px 14px;font-size:20px;font-weight:900}.weather{position:absolute;z-index:20;top:78px;right:14px;padding:8px 11px;min-width:138px;text-align:center}.profileStats{display:flex;align-items:center;gap:7px;font-size:11px;margin-top:3px}.miniEnergy{display:flex;align-items:center;gap:5px}.miniEnergy .track{width:78px;margin:0}.miniEnergy b{font-size:10px}.track{height:7px;background:#10261f;border-radius:99px;overflow:hidden;margin-top:5px}.track i{display:block;height:100%;background:#58bfff}.toolbar{position:absolute;z-index:30;top:124px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;background:#24453dbc;border-radius:19px;max-width:94vw}.navitems{display:flex;gap:6px}.toolbar.collapsed .navitems{display:none}.navToggle{width:42px;height:48px;border:0;border-radius:14px;background:#203f37;color:#fff;font-size:20px}.tool{width:50px;height:48px;border:0;border-radius:14px;background:linear-gradient(#fff6cc,#f5c34e);box-shadow:0 5px #8a633c;color:#513a24;font-size:19px}.tool small{display:block;font-size:7px;font-weight:800}.island{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);width:114vw;height:64vh;border-radius:39% 39% 35% 42%/22% 25% 23% 27%;background:radial-gradient(circle,#b9ef72 0 42%,#8bd153 68%,#5ba844);box-shadow:0 22px 0 #4e8b42,0 38px 0 #317d83}.plots{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:84%;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.plot{aspect-ratio:1.18;border:0;border-radius:16px;background:linear-gradient(145deg,#a46e44,#744526);box-shadow:inset 0 6px #ffffff10,0 6px #50321d50;position:relative;color:#fff}.plot.locked{background:linear-gradient(145deg,#95d65c,#67af41)}.crop{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);filter:drop-shadow(0 4px 2px #0003)}.seedStage .crop{font-size:19px}.sprout .crop{font-size:25px}.young .crop{font-size:30px}.mature .crop{font-size:35px}.ready .crop{font-size:38px;animation:pulse .9s ease-in-out infinite}.tag{position:absolute;top:5px;left:50%;transform:translateX(-50%);background:#203a34dd;border-radius:99px;font-size:8px;padding:3px 6px;white-space:nowrap}.stage{position:absolute;left:7px;bottom:14px;font-size:8px;background:#3b271db8;padding:2px 5px;border-radius:99px}.grow{position:absolute;left:10%;right:10%;bottom:6px;height:5px;background:#271f1aa9;border-radius:8px;overflow:hidden}.grow i{display:block;height:100%;background:#ffd35c}.care{position:absolute;left:5px;top:4px;font-size:12px}.problem{position:absolute;right:4px;top:4px;font-size:15px}.bottom{position:absolute;z-index:25;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.mission{padding:9px 12px}.mission strong{display:block;font-size:12px}.tray{padding:7px;display:flex;gap:6px;max-width:56vw;overflow:auto}.seedBtn{width:45px;height:45px;border:2px solid transparent;border-radius:14px;background:#ffffff16;color:#fff;font-size:22px;position:relative}.seedBtn.active{border-color:#ffd65b}.seedBtn b{position:absolute;right:2px;bottom:2px;background:#172a25d8;border-radius:99px;font-size:8px;padding:2px 5px}.modal{position:fixed;z-index:60;inset:0;background:#102c3388;display:none;place-items:center;padding:14px}.modal.open{display:grid}.panel{width:min(720px,96vw);max-height:88vh;overflow:auto;background:#fff4d8;color:#503921;border-radius:24px;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-16px;background:#fff4d8;padding:6px 0 10px;z-index:2}.close,.primary{border:0;border-radius:10px;background:#69a742;color:#fff;padding:8px 10px;font-weight:900}.close{width:36px;height:36px;border-radius:50%;background:#674832}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fffaf0;border:1px solid #ead8b7;border-radius:13px;padding:10px;margin:7px 0}.help{background:#fffaf0;border-radius:12px;padding:10px;font-size:12px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{background:#fffaf0;border:1px solid #ead8b7;border-radius:14px;padding:10px;text-align:center}.tiny{font-size:10px;color:#80684c}.toast{position:fixed;z-index:90;top:92px;left:50%;transform:translateX(-50%);background:#18372fee;padding:9px 14px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}@keyframes pulse{50%{transform:translateX(-50%) scale(1.12)}}@media(max-width:390px){.tool{width:46px}.toolbar,.navitems{gap:4px}.weather{min-width:120px}.name{font-size:13px}.xp{width:95px}.miniEnergy .track{width:62px}}
</style>
</head><body>
<main class="game"><header class="top"><div class="profile card"><div class="avatar">👩‍🌾</div><div><div class="name">Trang trại thử nghiệm</div><div class="profileStats"><span>LV <b id="lv">1</b></span><div class="xp"><i id="xp"></i></div><span class="miniEnergy">⚡ <b id="energyTxt"></b><span class="track"><i id="energy"></i></span></span></div></div></div><div class="money card">🌿 <span id="coin">0</span></div></header>
<div class="weather card" id="weather">☀️ Nắng</div>
<aside class="toolbar" id="toolbar"><button class="navToggle" onclick="toggleNav()" id="navToggle">☰</button><div class="navitems"><button class="tool" onclick="openModal('shop')">🏪<small>Shop</small></button><button class="tool" onclick="openModal('inventory')">🎒<small>Kho</small></button><button class="tool" onclick="openModal('orders')">📦<small>Đơn</small></button><button class="tool" onclick="openModal('quests')">📋<small>N.vụ</small></button><button class="tool" onclick="openModal('daily')">🎁<small>Ngày</small></button><button class="tool" onclick="openModal('test')">🔧<small>Test</small></button></div></aside>
<section class="island"><div class="plots" id="plots"></div></section>
<footer class="bottom"><div class="mission card"><small>ĐANG THEO DÕI</small><strong id="mission">Đang tải...</strong></div><div class="tray card" id="tray"></div></footer>
</main>
<div id="toast" class="toast"></div><div class="modal" id="modal"><section class="panel"><div class="head"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></section></div>
<script>
const CROPS={corn:{name:'Bắp',icon:'🌽',buy:6,sell:15,grow:55,xp:8,level:1},carrot:{name:'Cà rốt',icon:'🥕',buy:9,sell:22,grow:65,xp:11,level:1},wheat:{name:'Lúa mì',icon:'🌾',buy:12,sell:30,grow:78,xp:14,level:2},tomato:{name:'Cà chua',icon:'🍅',buy:16,sell:39,grow:92,xp:18,level:3},strawberry:{name:'Dâu tây',icon:'🍓',buy:24,sell:58,grow:110,xp:25,level:4},pumpkin:{name:'Bí ngô',icon:'🎃',buy:34,sell:82,grow:135,xp:34,level:5}};
const WEATHER={sunny:{name:'Nắng',icon:'☀️',speed:1.08,risk:1},cloudy:{name:'Nhiều mây',icon:'☁️',speed:1,risk:.9},rain:{name:'Mưa',icon:'🌧️',speed:.94,risk:1.15},hot:{name:'Nắng nóng',icon:'🌤️',speed:.84,risk:1.35}};
const QUESTS=[{id:'harvest3',title:'Thu hoạch 3 cây',type:'harvest',target:3,reward:60},{id:'plant10',title:'Trồng 10 cây',type:'plant',target:10,reward:90},{id:'water8',title:'Tưới 8 lần',type:'water',target:8,reward:75},{id:'fert5',title:'Bón phân 5 lần',type:'fert',target:5,reward:90},{id:'spray3',title:'Xử lý sâu bệnh 3 lần',type:'spray',target:3,reward:120}];
const ORDERS=[{name:'Quán ăn trong làng',need:{corn:3,carrot:2},reward:120},{name:'Chợ buổi sáng',need:{wheat:4,carrot:2},reward:165},{name:'Nhà hàng ven sông',need:{tomato:3,corn:3},reward:210},{name:'Lễ hội làng',need:{strawberry:2,pumpkin:1},reward:290}];
const DAILY=[40,55,70,90,120,160,250];
const DEFAULT={coin:220,lv:1,xp:0,energy:20,maxEnergy:20,lastEnergy:Date.now(),selected:'corn',weather:'sunny',weatherChangedAt:Date.now(),inventory:{seeds:{corn:8,carrot:5,wheat:2,tomato:0,strawberry:0,pumpkin:0},produce:{corn:0,carrot:0,wheat:0,tomato:0,strawberry:0,pumpkin:0},fertilizer:3,pesticide:2},stats:{plant:0,harvest:0,water:0,fert:0,spray:0},plots:[],orders:[],claimed:{},daily:{day:1,lastClaim:null},version:42};
const clone=x=>JSON.parse(JSON.stringify(x));const blankPlot=u=>({unlocked:u,crop:null,plantedAt:0,wateredStages:[],fertilized:false,problem:null,checkedStages:[],qualityPenalty:0});
function merge(a,b){for(const k in b){if(k==='produce')continue;if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],b[k]);else a[k]=b[k]}return a}
function normalizeWeather(v){if(typeof v==='string'&&WEATHER[v])return v;if(v&&typeof v==='object'&&typeof v.type==='string'&&WEATHER[v.type])return v.type;return 'sunny'}
function loadState(){
 let old=null; for(const key of ['farmCloudV042','farmCloudV041','farmCloudV040','farmCloudV034','farmCloudV033','farmCloudV031']){try{const x=localStorage.getItem(key);if(x){old=JSON.parse(x);break}}catch{}}
 const s=clone(DEFAULT); if(old)merge(s,old); s.weather=normalizeWeather(s.weather);
 s.inventory=s.inventory||clone(DEFAULT.inventory); s.inventory.seeds={...DEFAULT.inventory.seeds,...(s.inventory.seeds||{})}; s.inventory.fertilizer=Number(s.inventory.fertilizer||0); s.inventory.pesticide=Number(s.inventory.pesticide||0);
 const oldProd=old?.inventory?.produce||{}; s.inventory.produce=clone(DEFAULT.inventory.produce);
 for(const id in CROPS){const v=oldProd[id];if(typeof v==='number')s.inventory.produce[id]=Number(v||0);else if(v&&typeof v==='object')s.inventory.produce[id]=Object.values(v).reduce((a,b)=>a+Number(b||0),0)}
 if(!Array.isArray(s.plots)||!s.plots.length)s.plots=Array.from({length:20},(_,i)=>blankPlot(i<12));
 s.plots=s.plots.slice(0,20).map((p,i)=>{const n={...blankPlot(i<12),...(p||{})};if(!Array.isArray(n.wateredStages))n.wateredStages=p?.watered?[0]:[];if(!Array.isArray(n.checkedStages))n.checkedStages=[];return n});
 while(s.plots.length<20)s.plots.push(blankPlot(s.plots.length<12));
 if(!Array.isArray(s.orders)||!s.orders.length)s.orders=ORDERS.slice(0,3).map((o,i)=>({id:i,...clone(o)}));
 s.claimed=s.claimed&&typeof s.claimed==='object'?s.claimed:{}; s.daily=s.daily&&typeof s.daily==='object'?s.daily:{day:1,lastClaim:null}; s.version=42; return s
}
let S=loadState(); const $=q=>document.querySelector(q);
function save(){localStorage.setItem('farmCloudV042',JSON.stringify(S))}
function msg(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.remove('show'),1400)}
function regen(){const n=Math.floor((Date.now()-Number(S.lastEnergy||Date.now()))/60000);if(n>0){S.energy=Math.min(S.maxEnergy,S.energy+n);S.lastEnergy+=n*60000;save()}}
function spend(n=1){regen();if(S.energy<n){msg('⚡ Không đủ năng lượng');return false}S.energy-=n;save();return true}
function xpNeed(){return 100+(S.lv-1)*35}
function addXP(n){S.xp+=n;while(S.xp>=xpNeed()){S.xp-=xpNeed();S.lv++;S.maxEnergy=Math.min(40,S.maxEnergy+1);S.energy=S.maxEnergy;msg('🎉 Lên cấp '+S.lv)}save()}
function stageIndex(q){if(q<.16)return 0;if(q<.40)return 1;if(q<.72)return 2;if(q<1)return 3;return 4}
function stageInfo(q){return [{name:'Gieo hạt',icon:'🟤',cls:'seedStage'},{name:'Mầm',icon:'🌱',cls:'sprout'},{name:'Cây non',icon:'🌿',cls:'young'},{name:'Trưởng thành',icon:'🌳',cls:'mature'},{name:'Thu hoạch',icon:null,cls:'ready'}][stageIndex(q)]}
function progress(p){if(!p.crop||!CROPS[p.crop])return 0;let speed=WEATHER[S.weather]?.speed||1;speed*=1+Math.min(3,p.wateredStages.length)*.07;if(p.fertilized)speed*=1.15;if(p.problem)speed*=.55;return Math.min(1,(Date.now()-p.plantedAt)/(CROPS[p.crop].grow*1000/speed))}
function maybeProblem(p,q){const st=stageIndex(q);if(!p.crop||st<1||st>3||p.checkedStages.includes(st))return;p.checkedStages.push(st);let chance=.08*(WEATHER[S.weather]?.risk||1)*(st===3?1.25:1);if(Math.random()<chance){p.problem=Math.random()<.65?'pest':'disease';p.qualityPenalty+=12;msg(p.problem==='pest'?'🐛 Cây bị sâu!':'🦠 Cây bị bệnh!')}save()}
const unlockCost=i=>60+Math.max(0,i-12)*25;
function plotClick(i){const p=S.plots[i];if(!p.unlocked){const c=unlockCost(i);if(S.coin<c)return msg('Không đủ tiền');S.coin-=c;p.unlocked=true;save();render();return}
 if(!p.crop){const c=CROPS[S.selected];if(!c||S.lv<c.level||(S.inventory.seeds[S.selected]||0)<1)return msg('Không có hạt phù hợp');if(!spend())return;S.inventory.seeds[S.selected]--;Object.assign(p,blankPlot(true),{crop:S.selected,plantedAt:Date.now()});S.stats.plant++;save();render();return}
 const q=progress(p);maybeProblem(p,q);if(q>=1&&!p.problem)return harvestOne(i);openCare(i)
}
function water(i){const p=S.plots[i],st=stageIndex(progress(p));if(st>=4||p.wateredStages.includes(st))return;if(!spend())return;p.wateredStages.push(st);S.stats.water++;save();openCare(i);render()}
function fert(i){const p=S.plots[i],st=stageIndex(progress(p));if(p.fertilized)return;if(st<1)return msg('Chờ cây lên mầm');if(S.inventory.fertilizer<1)return msg('Hết phân bón');if(!spend())return;S.inventory.fertilizer--;p.fertilized=true;S.stats.fert++;save();openCare(i);render()}
function spray(i){const p=S.plots[i];if(!p.problem)return;if(S.inventory.pesticide<1)return msg('Hết thuốc');if(!spend())return;S.inventory.pesticide--;p.problem=null;S.stats.spray++;save();openCare(i);render()}
function harvestOne(i){const p=S.plots[i];if(!p.crop||progress(p)<1||p.problem)return false;if(!spend())return false;const id=p.crop;S.inventory.produce[id]=(S.inventory.produce[id]||0)+1;S.stats.harvest++;addXP(CROPS[id].xp);Object.assign(p,blankPlot(true));save();render();msg('✅ Thu hoạch '+CROPS[id].name);return true}
function openCare(i){const p=S.plots[i],q=progress(p),st=stageIndex(q),c=CROPS[p.crop],s=stageInfo(q);$('#modal').classList.add('open');$('#modalTitle').textContent=c.name+' • '+s.name;$('#modalBody').innerHTML=`<div class="help">Tiến độ <b>${Math.floor(q*100)}%</b>${p.problem?`<br>${p.problem==='pest'?'🐛 Sâu':'🦠 Bệnh'}`:''}</div><div class="row"><span>💧 Tưới giai đoạn này</span><button class="primary" onclick="water(${i})" ${st>=4||p.wateredStages.includes(st)?'disabled':''}>${p.wateredStages.includes(st)?'Đã tưới':'Tưới'}</button></div><div class="row"><span>✨ Bón phân (${S.inventory.fertilizer})</span><button class="primary" onclick="fert(${i})" ${p.fertilized?'disabled':''}>${p.fertilized?'Đã bón':'Bón'}</button></div><div class="row"><span>🧴 Thuốc (${S.inventory.pesticide})</span><button class="primary" onclick="spray(${i})" ${!p.problem?'disabled':''}>Phun</button></div>`}
function renderPlots(){for(const p of S.plots)if(p.crop)maybeProblem(p,progress(p));$('#plots').innerHTML=S.plots.map((p,i)=>{if(!p.unlocked)return `<button class="plot locked" onclick="plotClick(${i})"><span class="tag">🔒 ${unlockCost(i)} 🌿</span></button>`;if(!p.crop)return `<button class="plot" onclick="plotClick(${i})"></button>`;const q=progress(p),c=CROPS[p.crop],s=stageInfo(q),ready=q>=1&&!p.problem,icon=q>=1?c.icon:(s.icon||c.icon),st=stageIndex(q);return `<button class="plot ${s.cls} ${ready?'ready':''}" onclick="plotClick(${i})"><span class="tag">${ready?'THU HOẠCH':p.problem&&q>=1?'CẦN XỬ LÝ':Math.floor(q*100)+'%'}</span><span class="care">${p.wateredStages.includes(st)?'💧':''}${p.fertilized?'✨':''}</span><span class="problem">${p.problem?(p.problem==='pest'?'🐛':'🦠'):''}</span><span class="crop">${icon}</span><span class="stage">${q>=1?'Thu hoạch':s.name}</span><span class="grow"><i style="width:${q*100}%"></i></span></button>`}).join('')}
const totalProduce=id=>Number(S.inventory.produce[id]||0);
function sellOne(id){if((S.inventory.produce[id]||0)<1)return;S.inventory.produce[id]--;S.coin+=CROPS[id].sell;save();openModal('inventory');render()}
function orderReady(o){return Object.entries(o.need).every(([id,n])=>totalProduce(id)>=n)}
function completeOrder(i){const o=S.orders[i];if(!orderReady(o))return msg('Chưa đủ nông sản');for(const [id,n] of Object.entries(o.need))S.inventory.produce[id]-=n;S.coin+=o.reward;addXP(Math.round(o.reward/8));S.orders[i]={id:Date.now()+i,...clone(ORDERS[(Date.now()+i)%ORDERS.length])};save();openModal('orders');render()}
function claimQuest(id){const q=QUESTS.find(x=>x.id===id);if(!q||S.claimed[id]||(S.stats[q.type]||0)<q.target)return;S.claimed[id]=true;S.coin+=q.reward;addXP(Math.round(q.reward/4));save();openModal('quests');render()}
function claimDaily(){const today=new Date().toDateString();if(S.daily.lastClaim===today)return;const r=DAILY[Math.min(S.daily.day-1,6)];S.coin+=r;S.daily.lastClaim=today;S.daily.day=S.daily.day>=7?1:S.daily.day+1;save();openModal('daily');render()}
function maybeWeather(){if(Date.now()-Number(S.weatherChangedAt||Date.now())<90000)return;const a=Object.keys(WEATHER);let n=S.weather;while(n===S.weather)n=a[Math.floor(Math.random()*a.length)];S.weather=n;S.weatherChangedAt=Date.now();save()}
function render(){regen();maybeWeather();$('#coin').textContent=S.coin;$('#lv').textContent=S.lv;$('#xp').style.width=Math.min(100,S.xp/xpNeed()*100)+'%';$('#energyTxt').textContent=S.energy+'/'+S.maxEnergy;$('#energy').style.width=(S.energy/S.maxEnergy*100)+'%';const w=WEATHER[S.weather]||WEATHER.sunny;$('#weather').textContent=w.icon+' '+w.name;const seeds=Object.entries(CROPS).filter(([id,c])=>S.lv>=c.level&&(S.inventory.seeds[id]||0)>0);if(!seeds.some(([id])=>id===S.selected)&&seeds.length)S.selected=seeds[0][0];$('#tray').innerHTML=seeds.map(([id,c])=>`<button class="seedBtn ${S.selected===id?'active':''}" onclick="S.selected='${id}';save();render()">${c.icon}<b>${S.inventory.seeds[id]}</b></button>`).join('');const q=QUESTS.find(x=>!S.claimed[x.id])||QUESTS[0];$('#mission').textContent=q.title+' ('+Math.min(S.stats[q.type]||0,q.target)+'/'+q.target+')';renderPlots()}
function toggleNav(){const t=$('#toolbar');t.classList.toggle('collapsed');$('#navToggle').textContent=t.classList.contains('collapsed')?'☰':'✕'}
function openModal(type){$('#modal').classList.add('open');const title=$('#modalTitle'),body=$('#modalBody');if(type==='shop'){title.textContent='Cửa hàng';body.innerHTML=`<div class="grid">${Object.entries(CROPS).map(([id,c])=>`<div class="item"><b>${c.icon} ${c.name}</b><p class="tiny">LV ${c.level}</p><button class="primary" onclick="buySeed('${id}')" ${S.lv<c.level?'disabled':''}>Mua 5 • ${c.buy*5}🌿</button></div>`).join('')}<div class="item">✨ Phân bón<br><button class="primary" onclick="buyItem('fertilizer',3,45)">Mua 3 • 45</button></div><div class="item">🧴 Thuốc<br><button class="primary" onclick="buyItem('pesticide',3,60)">Mua 3 • 60</button></div></div>`}
else if(type==='inventory'){title.textContent='Kho';const seedRows=Object.entries(CROPS).filter(([id])=>(S.inventory.seeds[id]||0)>0).map(([id,c])=>`<div class="row"><span>${c.icon} ${c.name}</span><b>${S.inventory.seeds[id]}</b></div>`).join('');const produceRows=Object.entries(CROPS).filter(([id])=>(S.inventory.produce[id]||0)>0).map(([id,c])=>`<div class="row"><span>${c.icon} ${c.name}</span><span><b>${S.inventory.produce[id]}</b> <button class="primary" style="padding:5px 7px;margin-left:6px" onclick="sellOne('${id}')">Bán ${c.sell}🌿</button></span></div>`).join('');let supplies='';if(S.inventory.fertilizer>0)supplies+=`<div class="row">✨ Phân bón <b>${S.inventory.fertilizer}</b></div>`;if(S.inventory.pesticide>0)supplies+=`<div class="row">🧴 Thuốc <b>${S.inventory.pesticide}</b></div>`;body.innerHTML=`<h3>🌰 Hạt giống</h3>${seedRows||'<div class="help">Không có hạt giống.</div>'}<h3>🧺 Cây đã thu hoạch</h3>${produceRows||'<div class="help">Chưa có nông sản.</div>'}${supplies?'<h3>🧰 Vật tư</h3>'+supplies:''}`}
else if(type==='orders'){title.textContent='Đơn hàng';body.innerHTML=S.orders.map((o,i)=>`<div class="row"><div><b>${o.name}</b><div class="tiny">${Object.entries(o.need).map(([k,v])=>CROPS[k].icon+' '+v+' (có '+totalProduce(k)+')').join(' • ')}</div></div><button class="primary" onclick="completeOrder(${i})" ${orderReady(o)?'':'disabled'}>Giao<br>${o.reward}🌿</button></div>`).join('')}
else if(type==='quests'){title.textContent='Nhiệm vụ';body.innerHTML=QUESTS.map(q=>{const cur=S.stats[q.type]||0,ok=cur>=q.target,cl=S.claimed[q.id];return `<div class="row"><div><b>${cl?'✅ ':''}${q.title}</b><div class="tiny">${Math.min(cur,q.target)}/${q.target}</div></div><button class="primary" onclick="claimQuest('${q.id}')" ${!ok||cl?'disabled':''}>${cl?'Đã nhận':'Nhận '+q.reward+'🌿'}</button></div>`}).join('')}
else if(type==='daily'){title.textContent='Quà ngày';const today=new Date().toDateString(),cl=S.daily.lastClaim===today;body.innerHTML=`<div class="grid">${DAILY.map((r,i)=>`<div class="item">Ngày ${i+1}<br>🎁 ${r}🌿</div>`).join('')}</div><p><button class="primary" onclick="claimDaily()" ${cl?'disabled':''}>${cl?'Đã nhận':'Nhận ngày '+S.daily.day}</button></p>`}
else if(type==='test'){title.textContent='Test';body.innerHTML=`<div class="grid"><button class="primary" onclick="S.coin+=500;save();render()">+500🌿</button><button class="primary" onclick="S.energy=S.maxEnergy;save();render()">Đầy ⚡</button><button class="primary" onclick="advanceStage()">+1 giai đoạn</button><button class="primary" onclick="nextWeather()">Đổi thời tiết</button><button class="primary" onclick="forceProblem()">Tạo sâu/bệnh</button><button class="primary" onclick="addSeeds()">+5 hạt</button><button class="primary" onclick="resetSave()">Reset save</button></div><p class="help">v0.4.2 localStorage • chưa Firebase.</p>`}}
function closeModal(){$('#modal').classList.remove('open')}
function buySeed(id){const c=CROPS[id],cost=c.buy*5;if(S.lv<c.level)return msg('Cần LV '+c.level);if(S.coin<cost)return msg('Không đủ tiền');S.coin-=cost;S.inventory.seeds[id]+=5;save();openModal('shop');render()}
function buyItem(k,n,c){if(S.coin<c)return msg('Không đủ tiền');S.coin-=c;S.inventory[k]+=n;save();openModal('shop');render()}
function advanceStage(){for(const p of S.plots)if(p.crop&&CROPS[p.crop])p.plantedAt-=CROPS[p.crop].grow*1000*.26;save();render()}
function nextWeather(){const a=Object.keys(WEATHER),i=a.indexOf(S.weather);S.weather=a[(i+1)%a.length];S.weatherChangedAt=Date.now();save();render()}
function forceProblem(){const p=S.plots.find(x=>x.crop&&CROPS[x.crop]);if(!p)return;p.problem=Math.random()<.5?'pest':'disease';p.qualityPenalty+=12;save();render()}
function addSeeds(){for(const k in S.inventory.seeds)S.inventory.seeds[k]+=5;save();render()}
function resetSave(){if(confirm('Xóa save local để test lại?')){for(const k of ['farmCloudV042','farmCloudV041','farmCloudV040','farmCloudV034','farmCloudV033','farmCloudV031'])localStorage.removeItem(k);location.reload()}}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
try{render()}catch(e){console.error(e);localStorage.removeItem('farmCloudV042');S=clone(DEFAULT);S.plots=Array.from({length:20},(_,i)=>blankPlot(i<12));S.orders=ORDERS.slice(0,3).map((o,i)=>({id:i,...clone(o)}));save();render()}
setInterval(()=>{try{maybeWeather();renderPlots();regen();$('#energyTxt').textContent=S.energy+'/'+S.maxEnergy;$('#energy').style.width=(S.energy/S.maxEnergy*100)+'%'}catch(e){console.error(e)}},1000);
</script></body></html>
