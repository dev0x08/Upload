name: SpamSMSVipRebuild
options:
  bundleIdPrefix: ctdotech
  deploymentTarget:
    iOS: "13.0"
targets:
  SpamSMSVipRebuild:
    type: application
    platform: iOS
    sources:
      - path: SpamSMSVip
        excludes:
          - Resources
    resources:
      - SpamSMSVip/Resources
    info:
      path: SpamSMSVip/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ctdotech.xcodeapptesst.rebuild
        PRODUCT_NAME: SpamSMS
        CLANG_ENABLE_MODULES: YES
        INFOPLIST_FILE: SpamSMSVip/Info.plist
